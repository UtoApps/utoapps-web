<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024" role="img" aria-label="Calenzzu">
  <title>Calenzzu — símbolo</title>
  <!--
    DOS AGENDAS QUE SE CRUZAN: una masa violeta que entra por arriba a la
    izquierda y una verde que entra por abajo a la derecha. Se solapan en la
    diagonal, y justo ahí va un ÓVALO BLANCO: el HUECO LIBRE COMÚN, que es lo
    único que hace la app. El símbolo cuenta el producto; no decora.

    Sin modos de fusión: el cruce está pintado a mano, así se ve idéntico en
    cualquier navegador, en las tiendas y en un favicon de 32 px.
  -->
  <defs>
    <linearGradient id="cz-violeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#5B2EE5"/>
    </linearGradient>
    <linearGradient id="cz-verde" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12A177"/>
      <stop offset="1" stop-color="#53E8B2"/>
    </linearGradient>
    <linearGradient id="cz-cruce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5BDD"/>
      <stop offset="1" stop-color="#1F9AA0"/>
    </linearGradient>

    <clipPath id="cz-marco"><rect x="2" y="2" width="116" height="116" rx="30"/></clipPath>
    <rect id="cz-masa-a" x="-22" y="-22" width="98" height="98" rx="30"/>
    <rect id="cz-masa-b" x="44"  y="44"  width="98" height="98" rx="30"/>
    <clipPath id="cz-corte-a"><use href="#cz-masa-a"/></clipPath>
  </defs>

  <g clip-path="url(#cz-marco)">
    <use href="#cz-masa-a" fill="url(#cz-violeta)"/>
    <use href="#cz-masa-b" fill="url(#cz-verde)"/>
    <g clip-path="url(#cz-corte-a)">
      <use href="#cz-masa-b" fill="url(#cz-cruce)"/>
    </g>
  </g>

  <!-- EL HUECO LIBRE COMÚN -->
  <ellipse cx="60" cy="60" rx="15" ry="20" fill="#FFFFFF" transform="rotate(-14 60 60)"/>
</svg>
