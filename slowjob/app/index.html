document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b20b5b71-6a34-42fc-9a80-a045668d3117\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Slow-Job\">\n<meta name=\"theme-color\" content=\"#122356\">\n<title>Slow-Job<\u002Ftitle>\n<link rel=\"apple-touch-icon\" href=\"icons/apple-touch-icon.png\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"icons/icon-192.png\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<style>/* =============================================================================\n   SLOWJOB — SISTEMA VISUAL DE LA APP\n   Hermana de Chronic Friends: MISMAS FORMAS, MISMA LETRA, OTRA PALETA.\n   Escrito el 30 sep 2026 · Gerhard: «quiero que tenga el mismo estilo de diseño,\n   textos, botones 3d... igual que la App de CF».\n\n   🔴 ESTO NO ES UNA PROPUESTA: es el sistema REAL de Chronic Friends (el fichero\n   styles.css que Claude Design ya conoce, bloque «Neumorphic 3D buttons»), tal\n   como ya se reutilizó en Calenzzu, con la paleta de SlowJob puesta encima.\n   Los números de las sombras, los radios, las alturas y las curvas de transición\n   son LOS MISMOS que en CF. Lo único que cambia son los colores.\n\n   🎨 LA PALETA ES PROVISIONAL: SlowJob todavía no tiene marca (paso A5 del\n   RoadMap). Por eso TODOS los colores viven en el bloque :root y en ningún otro\n   sitio: cuando llegue la marca, se cambia ese bloque y la app entera cambia.\n   Azul = la tratta y la confianza (y se distingue del verde de CF y del violeta\n   de Calenzzu). Verde = SOLO «hay match / ha salido bien». Ámbar = SOLO el\n   desbloqueo de pago.\n\n   👉 Claude Design: usa estas clases tal cual. No inventes otro sistema de\n   botones, no cambies los radios ni las sombras «para que quede mejor». Si\n   necesitas un componente que no está aquí, constrúyelo con estos ingredientes.\n   ============================================================================= */\n\n\n/* =============================================================================\n   1. TOKENS — la paleta provisional de SlowJob\n   Contrastes comprobados: blanco sobre #3D6FE0 (arriba del botón) 4,6:1 ·\n   blanco sobre #1F45B8 (abajo) 8,1:1 · tinta #052A1A sobre el verde #12A177\n   4,68:1 · tinta #3F2A00 sobre el ámbar #E39B12 5,8:1 · #1F45B8 sobre el papel\n   7,7:1. Todos pasan AA para texto normal. No los «corrijas» a ojo.\n   ============================================================================= */\n:root{\n  /* --- Azul SlowJob: el color DOMINANTE de la app (botón principal, cabecera,\n         pestaña activa). La tratta, la confianza. --- */\n  --blue-100:#E6EEFF;\n  --blue-200:#C9D9FF;\n  --blue-300:#9FB8FF;\n  --blue-400:#5B8DEF;     /* claro de marca: iconos y acentos sobre fondo oscuro */\n  --blue-500:#3D6FE0;     /* arriba del botón principal */\n  --blue-600:#1F45B8;     /* abajo del botón principal · oscuro de marca */\n  --blue-700:#183691;\n  --blue-800:#12286C;\n  --blue-900:#0D1D4F;\n\n  /* --- Verde: SOLO «hay match / conectado / ha salido bien». Igual que en CF y\n         Calenzzu, el verde significa algo: si se usa de adorno, deja de\n         significar nada y la pantalla del match pierde su golpe. --- */\n  --green-100:#DCFBF0;\n  --green-200:#A7F3D8;\n  --green-300:#53E8B2;\n  --green-400:#2ACF97;\n  --green-500:#12A177;\n  --green-600:#0D8562;\n\n  /* --- Ámbar: SOLO el desbloqueo de pago (5 CHF) y los avisos de «falta algo».\n         Es el color del dinero y de la atención, no de la decoración. --- */\n  --amber-100:#FFF6E0;\n  --amber-300:#FFD37A;\n  --amber-400:#F5B841;\n  --amber-500:#E39B12;\n  --amber-ink:#3F2A00;\n\n  /* --- Fondos --- */\n  --canvas:#122356;       /* azul profundo, detrás del móvil */\n  --canvas-2:#0B1638;\n  --paper:#F7F9FD;        /* el fondo de las pantallas */\n  --card:#FFFFFF;\n  --card-soft:#EEF3FF;    /* tarjeta con tinte azul muy suave */\n\n  /* --- Texto --- */\n  --ink:#1B2340;          /* 🔴 NUNCA negro puro */\n  --ink-soft:#3E4A6B;\n  --muted:#7A86A8;\n  --muted-2:#A3ACC6;\n  --on-blue:#FFFFFF;\n\n  /* --- Cabecera (el degradado detrás de la ilustración curva) --- */\n  --hdr-top:#3D6FE0;\n  --hdr-bot:#1F45B8;\n\n  /* --- Forma y elevación — IDÉNTICOS a Chronic Friends --- */\n  --radius-card:26px;\n  --radius-btn:16px;\n  --radius-pill:30px;\n}\n\n\n/* =============================================================================\n   2. BASE\n   ============================================================================= */\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\nhtml,body{margin:0;height:100%;}\n\n/* 🔤 TIPOGRAFÍA: la MISMA que Chronic Friends, Poppins. Gerhard la quiere igual.\n   Servida desde el propio proyecto (fonts/Poppins-*.woff2), NUNCA desde Google\n   Fonts: la landing de Calenzzu se cayó por cargar cosas de internet. */\n@font-face{font-family:'Poppins';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Poppins-400.woff2') format('woff2');}\n@font-face{font-family:'Poppins';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/Poppins-500.woff2') format('woff2');}\n@font-face{font-family:'Poppins';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/Poppins-600.woff2') format('woff2');}\n@font-face{font-family:'Poppins';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/Poppins-700.woff2') format('woff2');}\n/* ⚠️ El peso 800 NO está en docs/fonts/ (de CF solo vienen 300-700): hasta que se descargue\n   Poppins-800.woff2 de Google Fonts, el navegador usa el 700 para los títulos. No pasa nada. */\n@font-face{font-family:'Poppins';font-weight:800;font-style:normal;font-display:swap;src:url('fonts/Poppins-800.woff2') format('woff2');}\n\nbody{\n  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;\n  background:\n    radial-gradient(120% 90% at 50% 0%, #1E3A8A 0%, var(--canvas) 45%, var(--canvas-2) 100%);\n  display:flex;align-items:center;justify-content:center;\n  min-height:100%;overflow:hidden;\n  color:var(--ink);\n}\n\n/* Los títulos van en 700-800, como «Building good days» en CF */\nh1,h2,.ttl,.hero-num{font-weight:800;letter-spacing:-0.01em;}\n\n\n/* =============================================================================\n   3. MARCO DEL MÓVIL — copiado de Chronic Friends sin tocar una cifra\n   ============================================================================= */\n.stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}\n.phone{\n  position:relative;width:393px;height:852px;border-radius:54px;\n  background:#0A1230;              /* el bisel, en azul casi negro */\n  padding:13px;\n  box-shadow:\n    0 2px 4px rgba(0,0,0,.5) inset,\n    0 50px 80px -20px rgba(0,0,0,.6),\n    0 20px 40px -10px rgba(0,0,0,.45);\n  flex:none;\n}\n.phone::after{ /* insinúa los botones laterales */\n  content:\"\";position:absolute;left:-3px;top:170px;width:3px;height:62px;border-radius:3px;\n  background:#152047;box-shadow:0 84px 0 #152047,0 -78px 0 #152047;\n}\n.screen{\n  position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;\n  background:var(--paper);display:flex;flex-direction:column;\n}\n/* Tapa la línea clara de antialiasing en el borde redondeado. Misma solución\n   que en Chronic Friends: un anillo del color del bisel, por encima de todo. */\n.screen::after{\n  content:\"\";position:absolute;inset:0;border-radius:inherit;\n  box-shadow:inset 0 0 0 1.25px #0A1230;\n  pointer-events:none;z-index:200;\n}\n.notch{\n  position:absolute;top:11px;left:50%;transform:translateX(-50%);\n  width:120px;height:34px;background:#0A1230;border-radius:20px;z-index:60;\n}\n.screen-scroll{\n  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;\n  position:relative;scrollbar-width:none;-ms-overflow-style:none;\n}\n.screen-scroll::-webkit-scrollbar{width:0;display:none;}\n\n\n/* =============================================================================\n   4. CABECERA CURVA CON ILUSTRACIÓN — la seña de identidad de CF\n   En CF: ilustración del bosque arriba, terminada en una CURVA CONVEXA con un\n   HALO verde claro, y el título en blanco encima. Aquí, igual: la ilustración\n   de la tratta (dos pueblos, el lago, la carretera; la genera Gerhard, no la\n   inventes: deja el degradado + un SVG sencillo de marcador), la misma curva\n   y el halo en azul claro.\n   ============================================================================= */\n.hero{\n  position:relative;flex:none;overflow:hidden;\n  min-height:220px;padding:54px 22px 46px;\n  background:linear-gradient(180deg,var(--hdr-top) 0%,var(--hdr-bot) 100%);\n  color:#fff;\n}\n.hero.tall{min-height:330px;}\n.hero .ilustracion{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}\n.hero .ttl{position:relative;font-size:26px;font-weight:800;text-align:center;text-shadow:0 2px 12px rgba(10,20,70,.45);}\n/* la curva convexa + halo, como en CF */\n.hero::after{\n  content:\"\";position:absolute;left:-10%;right:-10%;bottom:-2px;height:44px;\n  background:var(--paper);border-radius:50% 50% 0 0 / 100% 100% 0 0;\n  box-shadow:0 -6px 22px rgba(155,184,255,.85),0 -2px 6px rgba(255,255,255,.9);\n}\n\n/* Barra de cabecera plana (pantallas interiores sin ilustración) */\n.topbar{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:6px 22px 14px;flex:none;\n  background:linear-gradient(180deg,var(--hdr-top) 0%,var(--hdr-bot) 100%);\n}\n.topbar .ttl{font-size:20px;font-weight:800;color:#fff;}\n\n/* Botón redondo esférico de la cabecera (atrás, ajustes…), como el «<» verde de CF */\n.icon-btn{\n  width:42px;height:42px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;border:none;color:#EAF0FF;\n  background:radial-gradient(120% 120% at 30% 25%, #6E9BF5, #183691);\n  box-shadow:\n    0 5px 10px rgba(15,30,90,.35),\n    inset 0 2px 2px rgba(255,255,255,.35),\n    inset 0 -3px 5px rgba(12,25,80,.45);\n  transition:transform .12s ease,box-shadow .12s ease;\n}\n.icon-btn:active{\n  transform:translateY(2px);\n  box-shadow:0 2px 5px rgba(15,30,90,.4),inset 0 2px 4px rgba(12,25,80,.5);\n}\n\n\n/* =============================================================================\n   5. 🔴 LOS BOTONES 3D — EL CORAZÓN DEL ENCARGO\n   Estructura idéntica a la de Chronic Friends: degradado vertical + UNA sombra\n   proyectada + DOS sombras internas (brillo arriba, oscuro abajo) y un\n   translateY(3px) al pulsar. Lo único que cambia es el color.\n   ============================================================================= */\n.btn3d{\n  border:none;cursor:pointer;color:#fff;font-family:inherit;font-weight:700;\n  display:inline-flex;align-items:center;justify-content:center;gap:9px;\n  min-width:0;\n  border-radius:var(--radius-btn);\n  padding:14px 22px;font-size:15px;\n\n  /* AZUL = el botón principal de SlowJob */\n  background:linear-gradient(180deg,var(--blue-500) 0%,var(--blue-600) 100%);\n  box-shadow:\n    0 8px 16px rgba(31,69,184,.42),\n    inset 0 2px 2px rgba(255,255,255,.55),\n    inset 0 -4px 6px rgba(12,30,100,.45);\n  transition:transform .12s ease,box-shadow .12s ease;\n}\n.btn3d:active{\n  transform:translateY(3px);\n  box-shadow:0 3px 7px rgba(31,69,184,.4),inset 0 2px 4px rgba(12,30,100,.4);\n}\n.btn3d.round{border-radius:50%;}\n.btn3d.pill{border-radius:var(--radius-pill);padding:13px 22px;}\n.btn3d.full{width:100%;}\n\n/* --- Las TARJETAS-BOTÓN grandes de la Home de CF («Check-In», «Food Scan»…):\n       botón 3D a todo el ancho, con icono cuadrado a la izquierda, título y\n       subtítulo. En SlowJob: «I tuoi match», «Il tuo profilo», «Come funziona». --- */\n.btn3d.big{\n  width:100%;justify-content:flex-start;text-align:left;\n  padding:16px 18px;border-radius:22px;gap:14px;\n}\n.btn3d.big .sub{display:block;font-size:12px;font-weight:600;opacity:.92;margin-top:2px;}\n.btn3d.big .ic{\n  width:44px;height:44px;border-radius:14px;flex:none;\n  display:flex;align-items:center;justify-content:center;\n  background:rgba(255,255,255,.22);box-shadow:inset 0 1px 1px rgba(255,255,255,.5);\n}\n\n/* --- VERDE = hay match / ha salido bien. Se usa en TRES sitios y en ninguno más:\n       · el botón «Vedi i match» cuando HAY matches\n       · «Mi interessa» confirmado / consenso dado\n       · el estado «Sbloccato ✓»\n   Tinta verde MUY oscura: sobre #12A177 (la parte baja del degradado, la peor)\n   da 4,68:1 → pasa AA. Blanco sobre este verde daría 2,4:1: por eso este\n   botón lleva tinta oscura y no blanca. --- */\n.btn3d.match{\n  background:linear-gradient(180deg,var(--green-300) 0%,var(--green-500) 100%);\n  box-shadow:\n    0 8px 16px rgba(18,161,119,.40),\n    inset 0 2px 2px rgba(255,255,255,.60),\n    inset 0 -4px 6px rgba(8,105,78,.45);\n  color:#052A1A;\n}\n.btn3d.match:active{\n  box-shadow:0 3px 7px rgba(18,161,119,.4),inset 0 2px 4px rgba(8,105,78,.4);\n}\n\n/* --- ÁMBAR = el desbloqueo de pago («Sblocca · 5 CHF») y nada más. --- */\n.btn3d.unlock{\n  background:linear-gradient(180deg,var(--amber-300) 0%,var(--amber-500) 100%);\n  box-shadow:\n    0 8px 16px rgba(227,155,18,.40),\n    inset 0 2px 2px rgba(255,255,255,.65),\n    inset 0 -4px 6px rgba(140,90,0,.40);\n  color:var(--amber-ink);\n}\n.btn3d.unlock:active{\n  box-shadow:0 3px 7px rgba(227,155,18,.4),inset 0 2px 4px rgba(140,90,0,.4);\n}\n\n/* --- OSCURO = acciones secundarias sobre fondo claro --- */\n.btn3d.dark{\n  background:radial-gradient(120% 120% at 32% 26%, #2E4F9E, #122356);\n  box-shadow:0 7px 14px rgba(10,20,60,.5),inset 0 2px 2px rgba(255,255,255,.28),inset 0 -4px 7px rgba(5,12,45,.55);\n  color:#E6EEFF;\n}\n\n/* --- SUAVE = «Non ora», «Annulla» y demás terceras opciones --- */\n.btn3d.soft{\n  background:linear-gradient(180deg,#ffffff,#E8EEF8);\n  color:var(--ink-soft);\n  box-shadow:0 7px 14px rgba(110,125,170,.30),inset 0 2px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(130,145,190,.35);\n}\n\n/* --- PELIGRO = solo «Blocca», «Segnala», «Elimina account». Rojo, y nunca de adorno. --- */\n.btn3d.danger{\n  background:linear-gradient(180deg,#F26D6D 0%,#C93B3B 100%);\n  box-shadow:0 8px 16px rgba(201,59,59,.38),inset 0 2px 2px rgba(255,255,255,.5),inset 0 -4px 6px rgba(120,20,20,.45);\n}\n\n\n/* =============================================================================\n   6. TARJETAS — mismo cristal que Chronic Friends\n   ============================================================================= */\n.card{\n  background:rgba(255,255,255,.72);\n  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n  border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.65);\n  box-shadow:0 12px 30px -10px rgba(20,40,110,.25),inset 0 1px 1px rgba(255,255,255,.7);\n  padding:16px;\n}\n.card-solid{\n  background:var(--card);border-radius:var(--radius-card);\n  box-shadow:0 12px 30px -12px rgba(20,40,110,.22);\n  padding:16px;\n}\n/* La tarjeta OSCURA de CF («My Flare Radar», «Nothing scheduled»): fondo del\n   color de marca profundo, texto blanco. En SlowJob: «La tua tratta». */\n.card-dark{\n  border-radius:var(--radius-card);\n  background:linear-gradient(160deg,#2E4F9E 0%,var(--blue-800) 100%);\n  box-shadow:0 14px 34px -10px rgba(18,40,120,.5),inset 0 2px 3px rgba(255,255,255,.35),inset 0 -5px 10px rgba(5,15,60,.4);\n  color:#fff;padding:20px;\n}\n.card-dark .big{font-size:26px;font-weight:800;line-height:1.15;}\n/* 🔴 SIN opacity en textos sobre oscuro: se pierde el contraste. Jerarquía por\n   tamaño o peso, nunca por opacidad. */\n.card-dark .sub{font-size:13.5px;font-weight:600;color:#DCE6FF;margin-top:4px;}\n\n/* 🎯 LA TARJETA DEL MATCH — la pieza más importante de la app. Anónima hasta el\n   desbloqueo: oficio, tratta, tipo de empresa, porcentaje. Sin nombre. */\n.card-match{\n  border-radius:var(--radius-card);\n  /* 🎨 CORREGIDO el 30 sep 2026 tras el informe de Claude Design (ronda 1): la versión\n     anterior llevaba texto BLANCO sobre #2ACF97→#0F8A66 y daba ≈1,9:1 arriba y 3,3:1\n     abajo: no pasaba AA. Ahora la tarjeta usa el MISMO degradado y la MISMA tinta que\n     el botón .btn3d.match: verde claro #53E8B2 → #12A177 con tinta #052A1A, que sobre\n     el extremo oscuro (#12A177, el peor caso) da 4,68:1 → AA para texto normal. */\n  background:linear-gradient(150deg,var(--green-300) 0%,var(--green-500) 100%);\n  box-shadow:0 14px 34px -10px rgba(18,161,119,.45),inset 0 2px 3px rgba(255,255,255,.55),inset 0 -5px 10px rgba(8,105,78,.35);\n  color:#052A1A;padding:22px 20px;\n}\n.card-match .oficio{font-size:22px;font-weight:800;line-height:1.15;}\n.card-match .tratta{font-size:15px;font-weight:700;margin-top:4px;}\n.card-match .anon{font-size:12.5px;font-weight:700;margin-top:10px;\n  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:30px;\n  background:rgba(255,255,255,.38);}\n\n/* Fila de lista */\n.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;}\n.lrow + .lrow{border-top:1px solid rgba(122,134,168,.16);}\n\n/* Icono cuadrado con relieve (iconos de sección, avatares anónimos) */\n.badge-ic{\n  width:46px;height:46px;border-radius:16px;flex:none;\n  display:flex;align-items:center;justify-content:center;color:#EAF0FF;\n  background:radial-gradient(120% 120% at 30% 25%, #6E9BF5, #183691);\n  box-shadow:0 5px 10px rgba(15,30,90,.3),inset 0 2px 2px rgba(255,255,255,.3),inset 0 -3px 5px rgba(12,25,80,.4);\n}\n.badge-ic.verde{background:radial-gradient(120% 120% at 30% 25%, var(--green-300), var(--green-500));color:#052A1A;}\n.badge-ic.ambar{background:radial-gradient(120% 120% at 30% 25%, var(--amber-300), var(--amber-500));color:var(--amber-ink);}\n\n/* Marca de verificación / consenso dado */\n.check{\n  width:34px;height:34px;border-radius:50%;flex:none;\n  display:flex;align-items:center;justify-content:center;color:#052A1A;\n  background:linear-gradient(180deg,var(--green-300),var(--green-500));\n  box-shadow:0 4px 8px rgba(18,161,119,.4),inset 0 1px 2px rgba(255,255,255,.5);\n}\n.check.off{\n  background:linear-gradient(180deg,#E8EEF8,#CFD8EA);color:#8A95B5;\n  box-shadow:inset 0 1px 3px rgba(80,95,140,.3);\n}\n\n/* Etiqueta de sección en mayúsculas de color, como «MY MEDICATIONS» en CF */\n.seclabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-600);padding:14px 22px 6px;}\n\n\n/* =============================================================================\n   7. PASTILLAS DE SELECCIÓN (los dos roles · las trattas · IT/EN)\n   Relieve suave apagadas, 3D azul la elegida — el mismo lenguaje que la\n   píldora activa de la barra inferior.\n   ============================================================================= */\n.modos{display:flex;gap:8px;padding:12px 16px;}\n.modo{\n  flex:1 1 0;min-width:0;border:none;cursor:pointer;font-family:inherit;\n  height:40px;border-radius:var(--radius-pill);\n  font-size:13.5px;font-weight:700;white-space:nowrap;\n  background:linear-gradient(180deg,#ffffff,#E8EEF8);\n  color:var(--ink-soft);\n  box-shadow:0 5px 10px rgba(110,125,170,.22),inset 0 1px 1px rgba(255,255,255,.9);\n  transition:transform .12s ease,box-shadow .12s ease,color .12s ease;\n}\n.modo.sel{\n  background:linear-gradient(180deg,var(--blue-500) 0%,var(--blue-600) 100%);\n  color:#fff;\n  box-shadow:0 8px 16px rgba(31,69,184,.42),inset 0 2px 2px rgba(255,255,255,.55),inset 0 -4px 6px rgba(12,30,100,.45);\n  transform:translateY(-1px);\n}\n\n\n/* =============================================================================\n   8. CAMPOS DE FORMULARIO — hundidos, como el interior de los botones al revés\n   ============================================================================= */\n.field{display:flex;flex-direction:column;gap:6px;padding:8px 22px;}\n.field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}\n.field input,.field select,.field textarea{\n  font-family:inherit;font-size:15px;color:var(--ink);\n  border:none;border-radius:var(--radius-btn);padding:14px 16px;\n  background:linear-gradient(180deg,#EEF2FA,#FFFFFF);\n  box-shadow:inset 0 2px 5px rgba(60,80,140,.18),inset 0 -1px 1px rgba(255,255,255,.9);\n  outline:none;\n}\n.field input:focus,.field select:focus,.field textarea:focus{\n  box-shadow:inset 0 2px 5px rgba(60,80,140,.18),0 0 0 3px rgba(91,141,239,.45);\n}\n\n\n/* =============================================================================\n   9. BARRA INFERIOR — la píldora 3D en la pestaña activa, como en CF\n   Home · Match · Chat · Profilo. El Home es una casita en la píldora, como en\n   CF, HASTA QUE HAYA LOGO: cuando exista, el Home pasa a ser el logo (como se\n   hizo en Calenzzu, con .tab-home). Está preparado abajo, apagado.\n   ============================================================================= */\n.tabbar{\n  position:relative;z-index:50;flex:none;\n  display:flex;align-items:center;justify-content:center;\n  padding:10px 10px 26px;\n  background:rgba(247,249,253,.92);\n  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n  border-top:1px solid rgba(122,134,168,.14);\n}\n.tab{\n  border:none;background:none;cursor:pointer;font-family:inherit;\n  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;\n  color:var(--muted-2);font-size:10px;font-weight:700;padding:4px 2px;flex:1 1 0;min-width:0;\n  white-space:nowrap;text-align:center;transition:color .15s ease;\n}\n.tab .tab-ic{\n  width:46px;height:38px;border-radius:14px;flex:none;\n  display:flex;align-items:center;justify-content:center;\n  transition:all .2s ease;\n}\n.tab.active{color:var(--blue-600);}\n.tab.active .tab-ic{\n  color:#fff;\n  background:linear-gradient(180deg,var(--blue-500),var(--blue-600));\n  box-shadow:0 6px 12px rgba(31,69,184,.42),inset 0 2px 2px rgba(255,255,255,.5),inset 0 -3px 5px rgba(12,30,100,.4);\n  transform:translateY(-2px);\n}\n.tab:not(.active) .tab-ic{color:var(--muted);}\n/* Punto de aviso (match nuevo, mensaje nuevo) en la esquina del icono */\n.tab .dot{position:absolute;top:2px;right:6px;width:10px;height:10px;border-radius:50%;\n  background:linear-gradient(180deg,var(--green-300),var(--green-500));box-shadow:0 0 0 2px var(--paper);}\n\n/* --- PREPARADO PARA CUANDO HAYA LOGO (paso A5): el Home como símbolo de marca,\n       con anillo de relieve en vez de píldora. Hoy NO se usa: no hay logo. --- */\n.tab-home.logo .tab-ic{\n  background:none !important;box-shadow:none !important;transform:none !important;\n  width:46px;height:46px;border-radius:50%;padding:5px;\n}\n.tab-home.logo .tab-ic img,.tab-home.logo .tab-ic svg{width:100%;height:100%;display:block;}\n.tab-home.logo:not(.active) .tab-ic{filter:saturate(.25) opacity(.55);}\n.tab-home.logo.active .tab-ic{\n  filter:none;transform:translateY(-2px) !important;\n  background:radial-gradient(120% 120% at 30% 25%, #ffffff, #EEF3FF) !important;\n  box-shadow:0 6px 14px rgba(31,69,184,.35),inset 0 2px 2px rgba(255,255,255,.9),0 0 0 2px rgba(91,141,239,.45) !important;\n}\n\n\n/* =============================================================================\n   10. INTERRUPTOR (avisos, «Appari nei match»)\n   ============================================================================= */\n.toggle{\n  width:62px;height:34px;border-radius:20px;border:none;cursor:pointer;\n  position:relative;flex:none;\n  background:linear-gradient(180deg,#CFD8EA,#B3BFD8);\n  box-shadow:inset 0 2px 5px rgba(60,80,140,.45),inset 0 -1px 1px rgba(255,255,255,.4);\n  transition:background .25s ease;\n}\n.toggle .knob{\n  position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;\n  background:linear-gradient(180deg,#fff,#EEF3FF);\n  box-shadow:0 3px 6px rgba(20,40,110,.4),inset 0 1px 1px rgba(255,255,255,.9);\n  transition:left .25s cubic-bezier(.4,1.4,.5,1);\n}\n.toggle.on{\n  background:linear-gradient(180deg,var(--green-300),var(--green-500));\n  box-shadow:inset 0 2px 4px rgba(8,105,78,.4),inset 0 -1px 1px rgba(255,255,255,.3);\n}\n.toggle.on .knob{left:31px;}\n\n\n/* =============================================================================\n   11. AVISOS — el banner honesto («Nessun match ancora», «Il cambio lo decidono\n   i datori di lavoro»). Ámbar claro: es información, no un error.\n   ============================================================================= */\n.aviso{\n  background:linear-gradient(180deg,var(--amber-100),#FDEFC9);\n  border:1.5px solid #F0C860;border-radius:var(--radius-card);\n  padding:16px;color:#5B4410;font-size:14px;line-height:1.5;\n  box-shadow:0 10px 24px -12px rgba(120,90,20,.35);\n}\n.aviso strong{color:#3F2F06;}\n/* Aviso informativo azul (privacidad, cómo funciona) */\n.aviso.info{\n  background:linear-gradient(180deg,#EEF3FF,#E0E9FF);border-color:#B7C8FA;color:#1E2F66;\n  box-shadow:0 10px 24px -12px rgba(30,60,150,.3);\n}\n\n\n/* =============================================================================\n   12. BURBUJAS DEL CHAT\n   ============================================================================= */\n.msg{max-width:78%;padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.4;}\n.msg.mine{align-self:flex-end;color:#fff;\n  background:linear-gradient(180deg,var(--blue-500),var(--blue-600));\n  box-shadow:0 6px 14px rgba(31,69,184,.3),inset 0 1px 1px rgba(255,255,255,.4);border-bottom-right-radius:6px;}\n.msg.theirs{align-self:flex-start;color:var(--ink);background:var(--card);\n  box-shadow:0 6px 14px rgba(20,40,110,.15);border-bottom-left-radius:6px;}\n.msg .t{display:block;font-size:10.5px;font-weight:600;margin-top:4px;color:inherit;}\n\n\n/* =============================================================================\n   13. LO QUE NO SE HACE — reglas de Gerhard, no gustos\n   ============================================================================= */\n/* 🚫 NADA de tilt 3D: tarjetas que se inclinan y giran siguiendo el cursor.\n      A Gerhard le marea. Lo pidió quitar de Romizzu HQ el 19 jul 2026.\n      El relieve de los botones es ESTÁTICO: se hunden al pulsarlos y ya está.\n      Prohibido: transform:perspective() rotateX/rotateY guiado por el puntero,\n      transform-style:preserve-3d en tarjetas.\n   🚫 NADA de cargar librerías ni fuentes desde internet: la landing de Calenzzu\n      se cayó por eso (3,2 MB de unpk\u0067.com y pantalla en blanco sin conexión).\n      Poppins va servida desde el propio proyecto (fonts/).\n   🚫 NADA de rojo o verde «de adorno»: rojo = peligro (bloquear, denunciar,\n      borrar cuenta); verde = match / ha salido bien; ámbar = pago o falta algo.\n   ✅ SÍ valen: animación de entrada escalonada, elevación en hover, el hundido\n      al pulsar, el halo de la cabecera.                                        */\n\n@media (prefers-reduced-motion:reduce){\n  *{animation:none !important;transition:none !important;}\n}\n<\u002Fstyle>\n<script type=\"module\" src=\"74851c59-382b-471d-b6b5-9b2588790c96\"><\u002Fscript>\n<script type=\"module\" src=\"c5423511-dc82-42fc-9fe9-69f46aca92a9\"><\u002Fscript>\n<style>\nbody{overflow:auto;}\n.stage{height:auto;min-height:100vh;padding:24px 0;}\na{color:var(--blue-600);text-decoration:none;}a:hover{color:var(--blue-700);}\nbutton{font-family:inherit;}\n@keyframes sj-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes sj-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}\n@keyframes sj-pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}\n.sj-in>*{animation:sj-in .38s ease both}\n.sj-in>*:nth-child(2){animation-de
