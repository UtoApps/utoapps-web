<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2School — Demo con datos inventados</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.utoapps.ch/B2School/demo/">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/b2school-192.png">
<!-- Demo de B2School con datos inventados, copiada de su proyecto (b2school-demo.html, md5 67dcdcff) por preparar-pagina.py.
     No se edita aquí: se rehace la demo y se vuelve a copiar. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* UtoApps base — lo común de las demos por sector (9 oct 2026).
   Una columna de teléfono (máx. 460 px) · cabecera con la marca · barra de 5 pestañas abajo · hoja desde abajo ·
   vista «sul telefono del cliente» (chat) · aviso breve (toast). Cada demo pone su paleta en :root y la de
   «su misura» en :root[data-look="custom"]. Tipografía de la interfaz: Archivo (alojada en local para el vídeo). */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --raised:#efebe6; --line:#ddd6cd;
  --fg:#1b1714; --muted:#645b52; --acc:#0e6f68; --fill:#0e6f68; --on-fill:#ffffff; --acc-bg:rgba(14,111,104,.10);
  --ok:#17784a; --warn:#94600a; --bad:#b4372b;
  --ok-bg:rgba(23,120,74,.11); --warn-bg:rgba(148,96,10,.12); --bad-bg:rgba(180,55,43,.10);
  --shadow:0 10px 28px rgba(40,30,20,.14);
  --f-mark:Georgia,serif; --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.demo{display:flex;justify-content:center;gap:8px;padding:6px 10px;margin-inline:-16px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line)}
.demo b{color:var(--acc);font-weight:700}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;min-height:64px}
.mark{font-family:var(--f-mark);font-size:32px;line-height:1;position:relative;white-space:nowrap}
.mark-custom{display:none;align-items:center;gap:9px;white-space:nowrap}
.mark-custom .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fill);color:var(--on-fill);font-weight:800;font-size:18px}
.mark-custom .nm{font-size:21px;line-height:1.05}
.mark-custom .nm small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
:root[data-look="custom"] .mark{display:none}
:root[data-look="custom"] .mark-custom{display:inline-flex}
.shop{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.3}
.shop strong{display:block;color:var(--fg);font-size:13.5px;font-weight:650}
h1{font-size:25px;font-weight:780;font-stretch:90%;letter-spacing:-.01em;margin:16px 0 2px;text-wrap:balance}
h2{font-size:12px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.sub{color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;min-width:0}
.kpi .v{font-size:19px;font-weight:760;font-stretch:88%;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-right:2px}
.kpi .l{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.kpi.hot{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--acc-bg)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:14px;padding:12px;border-radius:14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.alert.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.alert.acc{background:var(--acc-bg);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.alert svg{color:var(--warn);margin-top:2px}
.alert.ok svg{color:var(--ok)} .alert.acc svg{color:var(--acc)}
.alert p{margin:0 0 8px} .alert p:last-child{margin-bottom:0}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
.row.dash{border-style:dashed}
.row p{margin:0}
.row .t{font-weight:700;font-size:15.5px}
.row .d{color:var(--muted);font-size:13px;margin-top:1px}
.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.slot .when{font-variant-numeric:tabular-nums;font-weight:720;font-size:15px;line-height:1.15;border-right:1px dashed var(--line);padding-right:10px}
.slot .when span{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:3px}
.slot .who{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slot .what{margin:1px 0 0}
.slot .by{margin:0;color:var(--muted);font-size:13px}
.slot.free{border-style:dashed;background:transparent}
.slot.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.lang{font-size:10.5px;font-weight:750;letter-spacing:.06em;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--acc-bg);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--raised);color:var(--fg)}
.btn.primary{background:var(--fill);color:var(--on-fill)}
.btn.small{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%;padding:13px 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card h3{margin:0 0 2px;font-size:19px;font-weight:760;font-stretch:92%}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 12px;margin:12px 0 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:2px}
.line p{margin:0} .line small{display:block;color:var(--muted);font-size:12.5px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid var(--fg);font-weight:780;font-size:17px;font-variant-numeric:tabular-nums}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:14px}
.locked{margin-top:12px;border-radius:14px;padding:11px 12px;background:var(--acc-bg);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.locked svg{color:var(--acc);margin-top:2px}
.locked p{margin:0} .locked small{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:650;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sw:first-child{border-top:0}
.sw p{margin:0} .sw small{display:block;color:var(--muted);font-size:12.5px}
.tog{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tog[aria-checked="true"]{background:var(--ok)}
.tog[aria-checked="true"]::after{left:21px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;margin-top:12px}
.bars div{display:grid;gap:4px;justify-items:center;align-self:end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc)}
.bars .low i{background:var(--warn)}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:var(--shadow);border-radius:999px;padding:13px 18px}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,460px);z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:650;cursor:pointer;position:relative}
nav.tabbar button[aria-current="page"]{color:var(--acc);background:var(--acc-bg)}
nav.tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(20,16,12,.5)}
.sheet .panel{width:min(100%,460px);margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-shadow:var(--shadow)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 2px;font-size:20px;font-weight:770;font-stretch:92%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;width:min(calc(100% - 32px),428px);background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
/* «sul telefono del cliente»: una schermata di messaggi, sopra a tutto */
.phone{position:fixed;inset:0;z-index:25;background:#e9e4dc;display:grid;grid-template-rows:auto 1fr auto}
.phone .ph-top{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;background:#f8f6f2;border-bottom:1px solid #d8d1c6;color:#1b1714}
.phone .ph-top .who{font-weight:750}
.phone .ph-top small{display:block;color:#6b6258;font-size:12px;font-weight:500}
.phone .ph-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--fill)}
.phone .ph-tag{grid-column:1/-1;justify-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:750;color:#6b6258;margin-bottom:2px}
.phone .ph-body{padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.bubble{max-width:84%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4;color:#1b1714;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble.in{background:#fff;border-top-left-radius:5px;align-self:flex-start}
.bubble.out{background:#d9f5c9;border-top-right-radius:5px;align-self:flex-end}
.bubble small{display:block;text-align:right;color:#7a7065;font-size:11px;margin-top:4px}
.bubble .b-btns{display:grid;gap:6px;margin-top:9px}
.bubble .b-btns button{border:1px solid #d8d1c6;background:#f8f6f2;border-radius:10px;padding:8px 10px;font-weight:700;color:#0b5cad;cursor:pointer}
.bubble .b-btns button[disabled]{opacity:.5}
.phone .ph-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;color:#6b6258}
@media (prefers-reduced-motion: no-preference){
  .view{animation:in .22s ease-out}
  .sheet .panel{animation:up .24s ease-out}
  .phone{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
}

/* B2School — la red profesional de las familias de un colegio. DEMO con datos inventados (9 nov 2026), para el vídeo en
   español y la landing; la plataforma real es otro trabajo. Misma receta que las demos de los vídeos de UtoApps
   (tienda/video-settori/LEEME.md): se monta con tienda/base/costruisci.py ../B2School/demo → b2school-demo.html.
   Login: SOLO lo que da de verdad «Sign In with LinkedIn using OpenID Connect» (nombre, foto y email; comprobado el
   9 nov 2026 en learn.microsoft.com y en linkedin.com/oauth/.well-known/openid-configuration): el cargo y el enlace al
   perfil los escribe la persona. Botón de texto «Continuar con LinkedIn», sin el logo «in» (marca de un tercero).
   Paleta: los azules del logo de B2School (la baldosa «B2», de #3BA1EB a #0E49A5); contrastes medidos (WCAG): --acc
   6,85:1 sobre blanco · blanco sobre --fill 5,73:1. «Portal del colegio» (escena 12): Colegio Nogal de ejemplo, verde y oro. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --raised:#e7edf5; --line:#d2dbe7;
  --fg:#0f1b2d; --muted:#4f5e74; --acc:#1559ad; --fill:#1765c1; --on-fill:#fff; --acc-bg:rgba(23,101,193,.10);
  --f-mark:"Archivo","Helvetica Neue",Arial,sans-serif;
}
:root[data-look="custom"]{
  --bg:#f6f4ec; --raised:#ebe6d8; --line:#d8d0bd; --acc:#1d6340; --fill:#1d6340; --acc-bg:rgba(29,99,64,.10);
}
body:not(.dentro) nav.tabbar{display:none}
.mark{display:flex;align-items:center}
.b2logo{display:block;width:134px;height:36px;background-repeat:no-repeat;background-position:left center;background-size:contain}
.mark-custom .logo{background:none;border-radius:0;width:40px;height:46px}
.mark-custom .nm{font-family:"C059","Century Schoolbook",Georgia,serif;font-weight:700;font-size:21px;color:#1d6340}
.mark-custom .nm small{font-size:11px;letter-spacing:.08em}
.shop{background:none;border:0;cursor:pointer;padding:0}
/* bienvenida */
.hero{margin-top:14px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#3ba1eb 0%,#1765c1 55%,#0e49a5 100%)}
.hero svg{display:block;width:100%;height:auto}
.feats{display:grid;gap:8px;margin:16px 0}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc)}
.feat p{margin:0} .feat .t{font-weight:700} .feat .d{color:var(--muted);font-size:13px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* personas */
.av{display:block;flex:none;border-radius:50%;overflow:hidden;line-height:0}
.av svg{display:block}
.perfil .pf{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.perfil .nm{margin:0;font-size:20px;font-weight:780;font-stretch:92%}
.perfil .d{margin:2px 0 0;color:var(--muted);font-size:13px}
.origen{display:flex;gap:8px;align-items:center;margin:12px 0 2px;padding:9px 11px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:13.5px;font-weight:600}
.fld{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 6px;font-weight:700;font-size:14px}
.fld small{font-weight:650;font-size:12px;color:var(--warn)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.pegar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.mi-sector{display:block;text-align:left;cursor:pointer;font-weight:600}
.mi-sector .prop{font-weight:600;font-size:12px;color:var(--warn);margin-left:4px}
/* el colegio, el curso y en qué ayudas */
.onb h2{margin:18px 0 8px}
.coles .row{cursor:pointer;padding:10px 12px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.row.sel .radio{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--surface)}
.fila{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
.fila .et{flex-basis:100%;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:-2px}
.fila .chip,.ayudas .chip{padding:7px 12px}
/* directorio */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raised);border-radius:12px;padding:4px;margin-top:14px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.pro{display:inline-block;margin-left:7px;font-size:11px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:#f2b705;color:#3a2a00;vertical-align:1px}
.filtros .search{margin-top:10px}
.persona{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.persona .av{grid-row:1/3;align-self:start}
.persona p{margin:0} .persona .t{font-weight:720;font-size:15.5px} .persona .d{color:var(--muted);font-size:13px;line-height:1.3;margin-top:1px}
.persona .pills{grid-column:2/-1;margin-top:2px}
.cuenta{margin:12px 2px 8px;font-size:13px;color:var(--muted);font-weight:650}
.grupo{margin:16px 2px 8px}
.grupo b{display:block;font-size:15px}
.grupo span{display:block;font-size:12.5px;color:var(--muted)}
.empresa{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;width:100%;text-align:left;cursor:pointer}
.elogo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em}
.empresa p{margin:0} .empresa .t{font-weight:720} .empresa .d{color:var(--muted);font-size:13px;line-height:1.3}
.ficha-emp .cab{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.ficha-emp .elogo{width:56px;height:56px;font-size:19px}
.ficha-emp h4{margin:14px 0 4px;font-size:12px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ficha-emp p{margin:0}
.ficha-emp .pills{margin-top:4px}
.colep{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--acc-bg);color:var(--acc)}
.pie-emp{display:flex;gap:8px;margin-top:16px}
.pie-emp .btn{flex:1;white-space:nowrap}
.pie-emp .btn.primary{flex:1.7}
.copiado{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 11px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:13.5px;font-weight:600}
.copiado svg{flex:none;margin-top:3px}
/* muro */
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 13px}
.post .ph{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.post .ph p{margin:0} .post .t{font-weight:720} .post .d{color:var(--muted);font-size:12.5px;line-height:1.3}
.post .h{font-size:12px;color:var(--muted);white-space:nowrap;align-self:start}
.post .txt{margin:8px 0 0;font-size:14.5px}
.post .pacts{display:flex;justify-content:flex-end;margin-top:8px}
.post.mio{box-shadow:0 0 0 2px var(--acc)}
.post.ad{background:var(--raised);border-style:dashed}
.post.ad .t{margin:8px 0 0}
.tipo{display:inline-block;margin-top:10px;font-size:12px;font-weight:750;padding:3px 9px;border-radius:999px}
.tipo.prov{background:#e3edfb;color:#1a4f96} .tipo.serv{background:#e2f3e8;color:#1d6a3e} .tipo.socio{background:#f0e6fa;color:#6a2fa0}
.tipo.proy{background:#fcecd9;color:#9a4a07} .tipo.ment{background:#ddf2f3;color:#0d6670}
.msg{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14.5px}
.msg b{color:var(--acc)}
.tipos .chip{padding:7px 12px;font-size:13.5px}
/* eventos */
.evento{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 13px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}
.fecha{border-radius:12px;background:var(--acc-bg);color:var(--acc);text-align:center;padding:6px 2px;align-self:start}
.fecha b{display:block;font-size:22px;line-height:1.05;font-weight:800}
.fecha span{display:block;font-size:11px;font-weight:750;letter-spacing:.06em}
.evento p{margin:0} .evento .t{font-weight:760;font-size:16px;line-height:1.25} .evento .d{color:var(--muted);font-size:13px;margin-top:2px}
.evento .pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.cupo{font-size:13px;font-weight:650}
.patro{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
/* el colegio */
.rol{display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);background:var(--acc-bg);padding:5px 10px;border-radius:999px}
.rol svg{width:15px;height:15px}
.ct{margin:0 0 4px;font-weight:720}
.gb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:end;height:150px;margin-top:8px}
.gb div{display:grid;gap:4px;justify-items:center;align-self:end;font-size:11px;color:var(--muted)}
.gb b{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.gb i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--fill) 50%,var(--surface))}
.gb .hoy i{background:var(--fill)}
.gb .hoy{color:var(--fg);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 104px 24px;gap:7px 10px;align-items:center;font-size:13.5px}
.hb i{display:block;height:10px;border-radius:5px;background:var(--fill)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.locked strong{display:block}
.locked small{display:block;margin-top:3px}
/* «portal del colegio» (escena 12) */
.choice{display:grid;gap:10px;margin-top:12px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;width:100%}
.opt p{margin:0} .opt .t{font-weight:780;font-size:16.5px} .opt .d{color:var(--muted);font-size:13px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
</style>
</head>

<script>
/* UtoApps base — JS común de las demos por sector (9 oct 2026).
   B.start({views, acts, tab}) pinta views[tab]() en #view; los botones con data-tab cambian de pestaña,
   los que llevan data-tab-go también, y los que llevan data-act llaman a acts[nombre](el). Hoja desde abajo
   (B.sheet), «sul telefono del cliente» (B.phone), aviso breve (B.toast) y aspetto su misura (B.look). */
(function () {
  var B = window.B = {};
  var cfg = null, cur = null;
  B.$ = function (s, r) { return (r || document).querySelector(s); };
  B.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  B.esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; });
  };
  function miles(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "'"); }
  B.chf = function (n, cent) {   // CHF 1'250.– · con centesimi: CHF 86.40
    return "CHF " + (cent ? miles(Math.floor(n)) + "." + (Math.round(n * 100) % 100 + 100).toString().slice(1) : miles(n) + ".–");
  };
  B.kchf = function (n) { return "<small>CHF</small>" + miles(n) + ".–"; };
  B.iniziali = function (n) { return n.split(" ").map(function (p) { return p[0]; }).join("").slice(0, 2); };
  function svg(d, w, sw) {
    return '<svg width="' + (w || 20) + '" height="' + (w || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
      (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  B.svg = svg;
  B.ICO = {
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 13, 3),
    warn: svg('<path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/>'),
    clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', 13, 2.4),
    lock: svg('<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>'),
    bell: svg('<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>'),
    send: svg('<path d="M4 11.5L20 4l-6.5 16-2.5-6.5z"/><path d="M11 13.5L20 4"/>', 16),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 18, 2.4),
    star: svg('<path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/>', 14),
    info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.3"/>'),
    spark: svg('<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2-5.2-1.8 5.2-1.8z"/>')
  };

  B.toast = function (msg, ms) {
    var t = B.$("#toast"); t.innerHTML = msg; t.hidden = false;
    clearTimeout(B.toast._t); B.toast._t = setTimeout(function () { t.hidden = true; }, ms || 3600);
  };

  /* ---------- pestañas ---------- */
  B.render = function (keep) {
    var y = window.scrollY;
    B.$("#view").innerHTML = cfg.views[cur]();
    B.$$("nav.tabbar [data-tab]").forEach(function (b) {
      if (b.getAttribute("data-tab") === cur) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (cfg.after && cfg.after[cur]) cfg.after[cur]();
    if (keep) window.scrollTo(0, y);
  };
  B.go = function (tab) {
    if (!cfg.views[tab]) return;
    cur = tab;
    var v = B.$("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
    B.render(false); window.scrollTo(0, 0);
    if (cfg.onTab) cfg.onTab(tab);
  };
  B.tab = function () { return cur; };
  B.badge = function (tab, n) {
    var b = B.$('nav.tabbar [data-tab="' + tab + '"]'); if (!b) return;
    var e = b.querySelector(".badge");
    if (!n) { if (e) e.remove(); return; }
    if (!e) { e = document.createElement("span"); e.className = "badge"; b.appendChild(e); }
    e.textContent = n;
  };

  /* ---------- hoja desde abajo ---------- */
  B.sheet = function (html) {
    B.$("#sheet-panel").innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
    B.$("#sheet").hidden = false;
  };
  B.closeSheet = function () { B.$("#sheet").hidden = true; };

  /* ---------- sul telefono del cliente (una chat) ---------- */
  B.phone = function (o) {
    var h = '<div class="ph-top"><span class="ph-tag">' + B.esc(o.tag || "Sul telefono del cliente") + '</span>' +
      '<span></span><span class="ph-av" style="' + (o.avStyle || "") + '">' + B.esc(o.av || "U") + '</span>' +

  function pasoColegio() {

  // el sector NO llega de LinkedIn: B2School lo PROPONE con las palabras del cargo que escribe la persona, y ella lo cambia

    publica: function () {
      if (!S.borrador) return;
      S.publicado = {t: S.borrador, txt: SUGERIDO[S.borrador], h: "ahora"};
      S.tipoF = "todas"; B.closeSheet(); B.go("muro");
      B.toast(ICO.check + ' Publicado en el muro de tu colegio');
    },
    empresa: function (el) {
      var e = empresa(el.getAttribute("data-e")), p = gente(e.de);
      B.sheet('<div class="ficha-emp"><div class="cab"><span class="elogo" style="background:' + e.col + '">' + e.ini + '</span><div><h3 style="margin:0">' + esc(e.n) + '</h3>'
        + '<p class="sub" style="font-size:13px">De ' + esc(p.n) + ' · ' + esc(e.fam) + '</p></div></div>'
        + '<h4>Qué hacemos</h4><p>' + esc(e.que) + '</p>'
        + '<h4>Servicios</h4><div class="pills">' + e.serv.map(function (x) { return '<span class="pill">' + esc(x) + '</span>'; }).join("") + '</div>'
        + '<h4>En qué colegios trabajamos</h4><div class="pills">' + e.coles.map(function (k) { return '<span class="colep">' + I.cole + COLES[k].n + '</span>'; }).join("") + '</div>'
        + '<div class="pie-emp"><button class="btn primary" data-act="escribir" data-p="' + p.id + '">' + ICO.send + ' Escribir a ' + esc(pila(p)) + '</button>'
        + '<button class="btn ghost" data-act="chiudi">Cerrar</button></div></div>');
    },
    apuntar: function (el) {
      var id = el.getAttribute("data-e"), e = EVENTOS.filter(function (x) { return x.id === id; })[0];
      S.apuntado[id] = true; B.render(true);
      B.toast(ICO.check + (e.ponentes ? ' Gracias: le pasamos tu nombre al colegio para preparar la charla' :' Apuntada: ' + e.f.toLowerCase() + '. Te lo recordamos el día antes.'));
    },
    versione: function () {
      if (S.paso !== 3) return;
      B.sheet('<h3>Portal del colegio</h3><p class="sub">Colegio Nogal de ejemplo · colegio partner de B2School</p><div class="choice">'
        + '<button class="opt" data-act="standard" aria-pressed="' + !S.look + '"><span><p class="t">Aspecto de B2School</p><p class="d">El logo y los colores de B2School</p></span>' + (S.look ? '' : '<span class="pill ok">' + ICO.check + '</span>') + '</button>'
        + '<button class="opt" data-act="su-misura" aria-pressed="' + S.look + '"><span><p class="t">Con la marca del colegio</p><p class="d">Su logo y sus colores, en todo el portal</p></span>' + (S.look ? '<span class="pill ok">' + ICO.check + '</span>' : '') + '</button></div>');
    },
    "su-misura": function () {
      S.look = true; B.look(true); cabecera(); acts.versione();
      setTimeout(function () { B.closeSheet(); B.go("oggi"); B.toast(ICO.spark + ' Portal del Colegio Nogal de ejemplo: su logo y sus colores', 2400); }, 1300);
    },
    standard: function () { S.look = false; B.look(false); cabecera(); B.closeSheet(); }
  };

  B.start({lang: "es",
    tab: "oggi",
    views: {oggi: oggi, directorio: directorio, muro: muro, eventos: eventos, colegio: colegio},
    acts: acts,
    after: {
      oggi: function () {
        var c = B.$("#cargo"), b = B.$(".mi-sector");
        if (c) c.addEventListener("input", function () {
          S.cargo = c.value; proponSector(); if (b) b.innerHTML = miSector();
          var v = B.$("#cargo-vista"); if (v) v.textContent = S.cargo || "Tu cargo saldrá aquí";
        });
      },
      directorio: function () { var q = B.$("#q"); if (q) q.addEventListener("input", function () { S.q = q.value; B.$("#res").innerHTML = resultados(); }); }
    },
    onTab: function (t) { B.$("#fab").hidden = t !== "muro"; if (t !== "directorio") S.q = ""; }
  });
  B.$("#fab").hidden = B.tab() !== "muro";
  cabecera();
})();
</script>
</body>
</html>
