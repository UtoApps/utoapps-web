[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.demo{display:flex;justify-content:center;gap:8px;padding:6px 10px;margin-inline:-16px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line)}
.demo b{color:var(--acc);font-weight:700}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;min-height:64px}
.mark{font-family:var(--f-mark);font-size:32px;line-height:1;position:relative;white-space:nowrap}
.mark-custom{display:none;align-items:center;gap:9px;white-space:nowrap}
.mark-custom .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fill);color:var(--on-fill);font-weight:800;font-size:18px}
.mark-custom .nm{font-size:21px;line-height:1.05}
.mark-custom .nm small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
:root[data-look="custom"] .mark{display:none}
:root[data-look="custom"] .mark-custom{display:inline-flex}
.shop{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.3}
.shop strong{display:block;color:var(--fg);font-size:13.5px;font-weight:650}
h1{font-size:25px;font-weight:780;font-stretch:90%;letter-spacing:-.01em;margin:16px 0 2px;text-wrap:balance}
h2{font-size:12px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.sub{color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;min-width:0}
.kpi .v{font-size:19px;font-weight:760;font-stretch:88%;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-right:2px}
.kpi .l{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.kpi.hot{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--acc-bg)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:14px;padding:12px;border-radius:14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.alert.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.alert.acc{background:var(--acc-bg);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.alert svg{color:var(--warn);margin-top:2px}
.alert.ok svg{color:var(--ok)} .alert.acc svg{color:var(--acc)}
.alert p{margin:0 0 8px} .alert p:last-child{margin-bottom:0}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
.row.dash{border-style:dashed}
.row p{margin:0}
.row .t{font-weight:700;font-size:15.5px}
.row .d{color:var(--muted);font-size:13px;margin-top:1px}
.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.slot .when{font-variant-numeric:tabular-nums;font-weight:720;font-size:15px;line-height:1.15;border-right:1px dashed var(--line);padding-right:10px}
.slot .when span{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:3px}
.slot .who{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slot .what{margin:1px 0 0}
.slot .by{margin:0;color:var(--muted);font-size:13px}
.slot.free{border-style:dashed;background:transparent}
.slot.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.lang{font-size:10.5px;font-weight:750;letter-spacing:.06em;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--acc-bg);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--raised);color:var(--fg)}
.btn.primary{background:var(--fill);color:var(--on-fill)}
.btn.small{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%;padding:13px 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card h3{margin:0 0 2px;font-size:19px;font-weight:760;font-stretch:92%}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 12px;margin:12px 0 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:2px}
.line p{margin:0} .line small{display:block;color:var(--muted);font-size:12.5px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid var(--fg);font-weight:780;font-size:17px;font-variant-numeric:tabular-nums}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:14px}
.locked{margin-top:12px;border-radius:14px;padding:11px 12px;background:var(--acc-bg);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.locked svg{color:var(--acc);margin-top:2px}
.locked p{margin:0} .locked small{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:650;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sw:first-child{border-top:0}
.sw p{margin:0} .sw small{display:block;color:var(--muted);font-size:12.5px}
.tog{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tog[aria-checked="true"]{background:var(--ok)}
.tog[aria-checked="true"]::after{left:21px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;margin-top:12px}
.bars div{display:grid;gap:4px;justify-items:center;align-self:end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc)}
.bars .low i{background:var(--warn)}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:var(--shadow);border-radius:999px;padding:13px 18px}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,460px);z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:650;cursor:pointer;position:relative}
nav.tabbar button[aria-current="page"]{color:var(--acc);background:var(--acc-bg)}
nav.tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(20,16,12,.5)}
.sheet .panel{width:min(100%,460px);margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;box-shadow:var(--shadow)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 2px;font-size:20px;font-weight:770;font-stretch:92%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;width:min(calc(100% - 32px),428px);background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
/* «sul telefono del cliente»: una schermata di messaggi, sopra a tutto */
.phone{position:fixed;inset:0;z-index:25;background:#e9e4dc;display:grid;grid-template-rows:auto 1fr auto}
.phone .ph-top{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;background:#f8f6f2;border-bottom:1px solid #d8d1c6;color:#1b1714}
.phone .ph-top .who{font-weight:750}
.phone .ph-top small{display:block;color:#6b6258;font-size:12px;font-weight:500}
.phone .ph-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--fill)}
.phone .ph-tag{grid-column:1/-1;justify-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:750;color:#6b6258;margin-bottom:2px}
.phone .ph-body{padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.bubble{max-width:84%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4;color:#1b1714;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble.in{background:#fff;border-top-left-radius:5px;align-self:flex-start}
.bubble.out{background:#d9f5c9;border-top-right-radius:5px;align-self:flex-end}
.bubble small{display:block;text-align:right;color:#7a7065;font-size:11px;margin-top:4px}
.bubble .b-btns{display:grid;gap:6px;margin-top:9px}
.bubble .b-btns button{border:1px solid #d8d1c6;background:#f8f6f2;border-radius:10px;padding:8px 10px;font-weight:700;color:#0b5cad;cursor:pointer}
.bubble .b-btns button[disabled]{opacity:.5}
.phone .ph-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;color:#6b6258}
@media (prefers-reduced-motion: no-preference){
  .view{animation:in .22s ease-out}
  .sheet .panel{animation:up .24s ease-out}
  .phone{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
}

/* B2School — la red profesional de las familias de un colegio. DEMO con datos inventados.
   ===== VERSIÓN 2 (12 nov 2026): los 8 comentarios del cliente sobre la demo del 9 nov (docs/cliente/2026-11-12_comentarios-…md) =====
   1 idiomas: español, inglés y catalán (un fichero por idioma: traduce.py + i18n.py) · 2-3 entrada: solo el logo, «Continuar con LinkedIn»,
   «Continuar con email» (sin contraseña: código de 6 cifras o enlace) y el idioma · 4 mensajería propia: bandeja, mensaje ya escrito y
   editable, el primero es una SOLICITUD que se acepta o se rechaza; LinkedIn, botón secundario · 5 solo entran las familias del colegio:
   código de invitación (o el aval de otra familia, o el colegio) · 6 de los hijos, solo la ETAPA o nada: ni nombre, ni curso, ni clase ·
   7 un colegio que empieza no enseña un directorio vacío: contador + invitar al grupo de WhatsApp · 8 resumen semanal por email.
   La demo del 9 nov (la del vídeo y la publicada) sigue en ../b2school-src.html, sin tocar; la plataforma real es otro trabajo. Misma receta que las demos de los vídeos de UtoApps
   (tienda/video-settori/LEEME.md): se monta con «python3 monta.py» (aquí al lado) → b2school-demo.html, -en.html y -ca.html.
   Login: SOLO lo que da de verdad «Sign In with LinkedIn using OpenID Connect» (nombre, foto y email; comprobado el
   9 nov 2026 en learn.microsoft.com y en linkedin.com/oauth/.well-known/openid-configuration): el cargo y el enlace al
   perfil los escribe la persona. Botón de texto «Continuar con LinkedIn», sin el logo «in» (marca de un tercero).
   Paleta: los azules del logo de B2School (la baldosa «B2», de #3BA1EB a #0E49A5); contrastes medidos (WCAG): --acc
   6,85:1 sobre blanco · blanco sobre --fill 5,73:1. «Portal del colegio» (escena 12): Colegio Nogal de ejemplo, verde y oro. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --raised:#e7edf5; --line:#d2dbe7;
  --fg:#0f1b2d; --muted:#4f5e74; --acc:#1559ad; --fill:#1765c1; --on-fill:#fff; --acc-bg:rgba(23,101,193,.10);
  --f-mark:"Archivo","Helvetica Neue",Arial,sans-serif;
}
:root[data-look="custom"]{
  --bg:#f6f4ec; --raised:#ebe6d8; --line:#d8d0bd; --acc:#1d6340; --fill:#1d6340; --acc-bg:rgba(29,99,64,.10);
}
body:not(.dentro) nav.tabbar{display:none}
.mark{display:flex;align-items:center}
.b2logo{display:block;width:134px;height:36px;background-repeat:no-repeat;background-position:left center;background-size:contain}
.mark-custom .logo{background:none;border-radius:0;width:40px;height:46px}
.mark-custom .nm{font-family:"C059","Century Schoolbook",Georgia,serif;font-weight:700;font-size:21px;color:#1d6340}
.mark-custom .nm small{font-size:11px;letter-spacing:.08em}
.shop{background:none;border:0;cursor:pointer;padding:0}
/* bienvenida */
.hero{margin-top:14px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#3ba1eb 0%,#1765c1 55%,#0e49a5 100%)}
.hero svg{display:block;width:100%;height:auto}
.feats{display:grid;gap:8px;margin:16px 0}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc)}
.feat p{margin:0} .feat .t{font-weight:700} .feat .d{color:var(--muted);font-size:13px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* personas */
.av{display:block;flex:none;border-radius:50%;overflow:hidden;line-height:0}
.av svg{display:block}
.perfil .pf{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.perfil .nm{margin:0;font-size:20px;font-weight:700;font-stretch:92%}
.perfil .d{margin:2px 0 0;color:var(--muted);font-size:13px}
.origen{display:flex;gap:8px;align-items:center;margin:12px 0 2px;padding:9px 11px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:13.5px;font-weight:600}
.fld{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 6px;font-weight:700;font-size:14px}
.fld small{font-weight:600;font-size:12px;color:var(--warn)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.pegar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.mi-sector{display:block;text-align:left;cursor:pointer;font-weight:600}
.mi-sector .prop{font-weight:600;font-size:12px;color:var(--warn);margin-left:4px}
/* el colegio, el curso y en qué ayudas */
.onb h2{margin:18px 0 8px}
.coles .row{cursor:pointer;padding:10px 12px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.row.sel .radio{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--surface)}
.fila{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
.fila .et{flex-basis:100%;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:-2px}
.fila .chip,.ayudas .chip{padding:7px 12px}
/* directorio */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raised);border-radius:12px;padding:4px;margin-top:14px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.pro{display:inline-block;margin-left:7px;font-size:11px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:#f2b705;color:#3a2a00;vertical-align:1px}
.filtros .search{margin-top:10px}
.persona{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.persona .av{grid-row:1/3;align-self:start}
.persona p{margin:0} .persona .t{font-weight:700;font-size:15.5px} .persona .d{color:var(--muted);font-size:13px;line-height:1.3;margin-top:1px}
.persona .pills{grid-column:2/-1;margin-top:2px}
.cuenta{margin:12px 2px 8px;font-size:13px;color:var(--muted);font-weight:600}
.grupo{margin:16px 2px 8px}
.grupo b{display:block;font-size:15px}
.grupo span{display:block;font-size:12.5px;color:var(--muted)}
.empresa{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;width:100%;text-align:left;cursor:pointer}
.elogo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em}
.empresa p{margin:0} .empresa .t{font-weight:700} .empresa .d{color:var(--muted);font-size:13px;line-height:1.3}
.ficha-emp .cab{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.ficha-emp .elogo{width:56px;height:56px;font-size:19px}
.ficha-emp h4{margin:14px 0 4px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ficha-emp p{margin:0}
.ficha-emp .pills{margin-top:4px}
.colep{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--acc-bg);color:var(--acc)}
.pie-emp{display:flex;gap:8px;margin-top:16px}
.pie-emp .btn{flex:1;white-space:nowrap}
.pie-emp .btn.primary{flex:1.7}
.copiado{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 11px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:13.5px;font-weight:600}
.copiado svg{flex:none;margin-top:3px}
/* muro */
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 13px}
.post .ph{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.post .ph p{margin:0} .post .t{font-weight:700} .post .d{color:var(--muted);font-size:12.5px;line-height:1.3}
.post .h{font-size:12px;color:var(--muted);white-space:nowrap;align-self:start}
.post .txt{margin:8px 0 0;font-size:14.5px}
.post .pacts{display:flex;justify-content:flex-end;margin-top:8px}
.post.mio{box-shadow:0 0 0 2px var(--acc)}
.post.ad{background:var(--raised);border-style:dashed}
.post.ad .t{margin:8px 0 0}
.tipo{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.tipo.prov{background:#e3edfb;color:#1a4f96} .tipo.serv{background:#e2f3e8;color:#1d6a3e} .tipo.socio{background:#f0e6fa;color:#6a2fa0}
.tipo.proy{background:#fcecd9;color:#9a4a07} .tipo.ment{background:#ddf2f3;color:#0d6670}
.msg{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14.5px}
.msg b{color:var(--acc)}
.tipos .chip{padding:7px 12px;font-size:13.5px}
/* eventos */
.evento{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 13px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}
.fecha{border-radius:12px;background:var(--acc-bg);color:var(--acc);text-align:center;padding:6px 2px;align-self:start}
.fecha b{display:block;font-size:22px;line-height:1.05;font-weight:800}
.fecha span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em}
.evento p{margin:0} .evento .t{font-weight:700;font-size:16px;line-height:1.25} .evento .d{color:var(--muted);font-size:13px;margin-top:2px}
.evento .pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.cupo{font-size:13px;font-weight:600}
.patro{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
/* el colegio */
.rol{display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);background:var(--acc-bg);padding:5px 10px;border-radius:999px}
.rol svg{width:15px;height:15px}
.ct{margin:0 0 4px;font-weight:700}
.gb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:end;height:150px;margin-top:8px}
.gb div{display:grid;gap:4px;justify-items:center;align-self:end;font-size:11px;color:var(--muted)}
.gb b{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.gb i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--fill) 50%,var(--surface))}
.gb .hoy i{background:var(--fill)}
.gb .hoy{color:var(--fg);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 104px 24px;gap:7px 10px;align-items:center;font-size:13.5px}
.hb i{display:block;height:10px;border-radius:5px;background:var(--fill)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.locked strong{display:block}
.locked small{display:block;margin-top:3px}
/* «portal del colegio» (escena 12) */
.choice{display:grid;gap:10px;margin-top:12px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;width:100%}
.opt p{margin:0} .opt .t{font-weight:700;font-size:16.5px} .opt .d{color:var(--muted);font-size:13px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
/* ===== v2 (12 nov 2026) ===== */
/* la entrada: solo el logo, los dos botones y el idioma */
body.entrando header.top{display:none}
.entrada{min-height:calc(100dvh - 200px);display:grid;align-content:center;justify-items:center;gap:12px;padding-top:28px}
.entrada .b2logo{width:228px;height:61px;background-position:center;margin-bottom:26px}
.entrada>.btn{max-width:340px}
.entrada .caja{width:100%;max-width:340px}
.entrada .caja .btn{margin-top:10px}
.entrada h1{text-align:center;margin-top:0}
.entrada .sub{text-align:center;overflow-wrap:anywhere}
.idiomas{display:flex;gap:4px;margin-top:26px;background:var(--raised);border-radius:999px;padding:4px}
.idiomas a{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);text-decoration:none}
.idiomas a[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.cod{letter-spacing:.3em;font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.av .ini{display:grid;place-items:center;border-radius:50%;background:var(--fill);color:#fff;font-weight:800;line-height:1}
/* el colegio: código de invitación, etapa de los hijos y ajustes */
.opc{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:4px}
.ayuda-demo{margin:10px 0 0;padding:8px 11px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--muted);line-height:2}
.ayuda-demo .chip{padding:3px 10px;font-size:12.5px}
.card.ajustes{padding-block:3px}
.enlace{background:none;border:0;padding:0;color:var(--acc);font-weight:700;cursor:pointer;font-size:13.5px;text-decoration:underline}
.etapas .chip{padding:7px 12px}
/* un colegio que empieza: el contador y la invitación */
.contador{background:var(--fill);color:var(--on-fill);border-radius:20px;padding:16px;margin-top:14px}
.contador .n{font-size:44px;font-weight:800;font-stretch:88%;line-height:1}
.contador p{margin:5px 0 0}
.contador .btn{margin-top:13px;background:#fff;color:#0e49a5}
.card.invita{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
/* mensajes */
.solic{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.solic .ph{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.solic p{margin:0} .solic .t{font-weight:700} .solic .d{color:var(--muted);font-size:12.5px;line-height:1.3}
.solic .txt{margin:9px 0 0;font-size:14.5px}
.solic .bts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.conv{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;width:100%;text-align:left;cursor:pointer}
.conv>span{min-width:0}
.conv p{margin:0} .conv .t{font-weight:700} .conv .d{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .h{font-size:12px;color:var(--muted);white-space:nowrap}
.msg-ed{display:block;width:100%;min-height:132px;resize:vertical;font:inherit;line-height:1.4;color:var(--fg)}
.chat-cab{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;margin-top:12px}
.chat-cab p{margin:0} .chat-cab .t{font-weight:700} .chat-cab .d{color:var(--muted);font-size:12.5px;line-height:1.3}
.atras{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.burbujas{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.bur{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14.5px;line-height:1.4}
.bur.in{background:var(--surface);border:1px solid var(--line);border-top-left-radius:5px;align-self:flex-start}
.bur.out{background:var(--fill);color:var(--on-fill);border-top-right-radius:5px;align-self:flex-end}
.bur small{display:block;text-align:right;font-size:11px;margin-top:4px;opacity:.8}
.responde{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:16px}
button.row{cursor:pointer;font:inherit;color:inherit}
/* el resumen semanal, como llega al correo */
.correo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.correo .de{font-size:12.5px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.correo .asunto{font-weight:700;font-size:17px;margin:4px 0 8px}
.correo ul{margin:0;padding-left:18px} .correo li{margin:5px 0}
.correo .baja{font-size:12px;color:var(--muted);margin:12px 0 0;text-decoration:underline}

/* ===== ESTILO DE LA FAMILIA (12 nov 2026) =====
   Pedido: que esta app lleve el estilo de las otras apps de la casa (relieve 3D en lo que se pulsa, la misma letra).
   ORIGEN, sin inventar: el sistema de estilo de esas apps, tal como está escrito en su hoja de estilo interna
   (degradado vertical + UNA sombra proyectada + DOS sombras internas, y 3 px hacia abajo al pulsar; radios 26 / 16 / 30;
   tarjetas blancas sin raya; campos hundidos; pestaña activa en relieve; cabecera de color acabada en curva con halo).
   Lo único propio es la PALETA: los azules del logo. Contrastes medidos (WCAG): blanco sobre lo alto del botón
   #1f74d0 4,70:1 y sobre lo bajo #0e49a5 8,35:1 · verde del portal #2a8258 4,74:1 · etiquetas #0e49a5 sobre el papel 7,78:1.
   Todo lo que cambia con el color vive en estas variables: el «portal» (data-look) solo las cambia.
   La letra (Poppins, pesos 400-800) va DENTRO de la página: la mete monta.py desde fonts/. Sin inclinaciones ni giros. */
:root{
  --bg:#f4f7fc; --surface:#ffffff; --raised:#e6edf8; --line:rgba(96,116,160,.20);
  --fg:#14213a; --muted:#55627a; --acc:#0e49a5; --fill:#1765c1; --acc-bg:rgba(23,101,193,.10);
  --f-mark:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tinta2:#3a4963; --raya:#b9c6de; --pie:#5c6885;
  --b-top:#1f74d0; --b-bot:#0e49a5; --b-hondo:#082c68; --b-rgb:14,73,165; --b-osc:6,30,84; --b-halo:156,200,247;
  --suave-bajo:#e8eef8; --som:110,125,170; --hundido:linear-gradient(180deg,#e9eef8,#ffffff); --carril:linear-gradient(180deg,#dfe6f2,#edf2fa); --hueco:60,80,140;
  --r-card:26px; --r-btn:16px; --r-pill:30px;
  --g-3d:linear-gradient(180deg,var(--b-top) 0%,var(--b-bot) 100%);
  --g-suave:linear-gradient(180deg,#ffffff,var(--suave-bajo));
  --s-3d:0 8px 16px rgba(var(--b-rgb),.42),inset 0 2px 2px rgba(255,255,255,.55),inset 0 -4px 6px rgba(var(--b-osc),.45);
  --s-3d-on:0 3px 7px rgba(var(--b-rgb),.40),inset 0 2px 4px rgba(var(--b-osc),.40);
  --s-3d-mini:0 5px 10px rgba(var(--b-rgb),.38),inset 0 2px 2px rgba(255,255,255,.5),inset 0 -3px 5px rgba(var(--b-osc),.4);
  --s-suave:0 7px 14px rgba(var(--som),.30),inset 0 2px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(var(--som),.30);
  --s-suave-on:0 2px 5px rgba(var(--som),.30),inset 0 2px 4px rgba(var(--som),.38);
  --s-card:0 12px 30px -14px rgba(20,40,110,.30),0 2px 6px rgba(20,40,110,.05);
}
:root[data-look="custom"]{
  --bg:#f6f4ec; --raised:#ebe6d8; --line:rgba(120,110,80,.24); --acc:#1d6340; --fill:#1d6340; --acc-bg:rgba(29,99,64,.10);
  --raya:#cdc3a8; --pie:#666252;
  --b-top:#2a8258; --b-bot:#1d6340; --b-hondo:#123f29; --b-rgb:29,99,64; --b-osc:10,48,30; --b-halo:191,227,207;
  --suave-bajo:#eee8d9; --som:130,120,90; --hundido:linear-gradient(180deg,#ebe5d5,#fffdf8); --carril:linear-gradient(180deg,#e4dccb,#f1ecdf); --hueco:110,95,55;
}
body{font-family:var(--f-ui);font-size:14.5px}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--acc);margin:24px 2px 10px}
.sub{color:var(--muted)}
.mark-custom .nm small{font-family:var(--f-ui);font-weight:600}
/* la franja de arriba, la cabecera con la marca y el título en su banda de color con la curva */
.demo{background:var(--b-hondo);color:#dbe8ff;border-bottom:0;font-size:10.5px;font-weight:600;padding:5px 10px}
.demo b{color:#fff;font-weight:800}
header.top{margin-inline:-16px;padding:12px 16px;background:var(--b-top)}
.mark,.mark-custom{background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 6px 14px rgba(var(--b-osc),.35),inset 0 -3px 5px rgba(var(--b-rgb),.14)}
.mark .b2logo{width:112px;height:30px}
.mark-custom .logo{width:34px;height:39px} .mark-custom .logo svg{width:34px;height:39px}
.mark-custom .nm{font-size:18px}
.shop{color:#fff;font-size:12px;font-weight:500}
.shop strong{color:#fff;font-size:13px;font-weight:700}
.cabz{position:relative;margin:0 -16px;padding:6px 22px 50px;text-align:center;color:#fff;overflow:hidden;
  background:radial-gradient(70% 120% at 8% 128%,rgba(255,255,255,.10) 0 62%,transparent 63%),
    radial-gradient(64% 110% at 94% 134%,rgba(255,255,255,.07) 0 62%,transparent 63%),
    linear-gradient(180deg,var(--b-top) 0%,var(--b-bot) 100%)}
.cabz::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-2px;height:34px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;
  box-shadow:0 -6px 22px rgba(var(--b-halo),.85),0 -2px 6px rgba(255,255,255,.9)}
.cabz h1{position:relative;margin:8px 0 4px;color:#fff;font-size:25px;line-height:1.2;text-shadow:0 2px 12px rgba(var(--b-osc),.45)}
.cabz .sub{position:relative;color:#fff;font-weight:500;font-size:13.5px}
.cabz .rol{position:relative;margin:4px 0 0;background:rgba(255,255,255,.22);color:#fff}
body.sin-cabz header.top{position:relative;overflow:hidden;padding-bottom:36px;background:linear-gradient(180deg,var(--b-top) 0%,var(--b-bot) 100%)}
body.sin-cabz header.top::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-2px;height:26px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;
  box-shadow:0 -6px 22px rgba(var(--b-halo),.85),0 -2px 6px rgba(255,255,255,.9)}
/* lo que se pulsa: relieve, y se hunde al pulsarlo */
.btn{border-radius:var(--r-btn);padding:12px 16px;font-weight:700;font-size:14.5px;color:var(--tinta2);background:var(--g-suave);
  box-shadow:var(--s-suave);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(3px);box-shadow:var(--s-suave-on)}
.btn.ghost{border:0;background:var(--g-suave)}
.btn.primary{color:#fff;background:var(--g-3d);box-shadow:var(--s-3d)}
.btn.primary:active{box-shadow:var(--s-3d-on)}
.btn.small{padding:8px 13px;font-size:13px;border-radius:13px;box-shadow:0 5px 10px rgba(var(--som),.26),inset 0 2px 2px rgba(255,255,255,.9),inset 0 -2px 4px rgba(var(--som),.28)}
.btn.small{white-space:nowrap}
.btn.small.primary{box-shadow:var(--s-3d-mini)}
.btn.small:active{box-shadow:var(--s-suave-on)} .btn.small.primary:active{box-shadow:var(--s-3d-on)}
.btn.wide{padding:14px 16px}
.btn[disabled]{opacity:.5;transform:none}
.fab{border-radius:var(--r-pill);padding:13px 20px}
.chip{border:0;border-radius:var(--r-pill);padding:9px 14px;font-weight:700;font-size:13px;color:var(--tinta2);background:var(--g-suave);
  box-shadow:0 5px 10px rgba(var(--som),.22),inset 0 1px 1px rgba(255,255,255,.9);transition:transform .12s ease,box-shadow .12s ease}
.chip:active{transform:translateY(2px)}
.chip[aria-pressed="true"]{border:0;color:#fff;background:var(--g-3d);box-shadow:var(--s-3d-mini);transform:translateY(-1px)}
.pro{background:linear-gradient(180deg,#ffd37a,#f5b841);color:#3a2a00;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.seg,.idiomas{background:var(--carril);box-shadow:inset 0 2px 5px rgba(var(--hueco),.22),inset 0 -1px 1px rgba(255,255,255,.9);border-radius:var(--r-pill);padding:5px;gap:5px}
.seg button,.idiomas a{border-radius:var(--r-pill);font-weight:700;color:var(--tinta2);transition:color .12s ease,box-shadow .12s ease}
.seg button{padding:9px 8px;font-size:13.5px}
.idiomas a{padding:8px 15px;font-size:13px}
.seg button[aria-pressed="true"],.idiomas a[aria-current="true"]{color:#fff;background:var(--g-3d);box-shadow:var(--s-3d-mini)}
.tog{width:62px;height:34px;border-radius:20px;background:linear-gradient(180deg,#cfd8ea,#b3bfd8);box-shadow:inset 0 2px 5px rgba(60,80,140,.45),inset 0 -1px 1px rgba(255,255,255,.4);transition:background .25s ease}
.tog::after{top:3px;left:3px;width:28px;height:28px;background:linear-gradient(180deg,#fff,#eef3ff);box-shadow:0 3px 6px rgba(20,40,110,.4),inset 0 1px 1px rgba(255,255,255,.9);transition:left .25s cubic-bezier(.4,1.4,.5,1)}
.tog[aria-checked="true"]{background:linear-gradient(180deg,#53e8b2,#12a177);box-shadow:inset 0 2px 4px rgba(8,105,78,.4),inset 0 -1px 1px rgba(255,255,255,.3)}
.tog[aria-checked="true"]::after{left:31px}
.atras{width:42px;height:42px;border:0;border-radius:50%;color:#fff;background:radial-gradient(120% 120% at 30% 25%,var(--b-top),var(--b-hondo));
  box-shadow:0 5px 10px rgba(var(--b-osc),.35),inset 0 2px 2px rgba(255,255,255,.35),inset 0 -3px 5px rgba(var(--b-osc),.45);transition:transform .12s ease}
.atras:active{transform:translateY(2px)}
.chat-cab{grid-template-columns:auto 40px minmax(0,1fr)}
.enlace{color:var(--acc);font-weight:700}
/* tarjetas: blancas, sin raya, con su sombra */
.card,.row,.persona,.empresa,.post,.evento,.solic,.conv,.feat,.kpi,.opt,.correo,.msg{border:0;background:var(--surface);box-shadow:var(--s-card)}
.card{border-radius:var(--r-card);padding:16px}
.row,.persona,.empresa,.post,.evento,.solic,.conv,.opt,.correo{border-radius:22px}
.feat,.kpi,.msg{border-radius:18px}
.persona,.empresa,.conv{padding:13px 14px}
.post,.evento,.solic{padding:14px 15px}
.list{gap:12px}
.row.dash{background:transparent;border:1.5px dashed var(--raya);box-shadow:none}
.post.ad{background:var(--raised);border:1.5px dashed var(--raya);box-shadow:none}
.row.sel,.opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--b-top),0 12px 26px -12px rgba(var(--b-rgb),.45)}
.post.mio{box-shadow:0 0 0 2px var(--b-top),var(--s-card)}
button.row,.empresa,.conv,.opt{transition:transform .12s ease}
button.row:active,.empresa:active,.conv:active,.opt:active{transform:translateY(2px)}
.card h3{font-size:18px;font-weight:800}
.ficha-emp h4{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--acc)}
.cupo{font-size:12.5px;font-weight:600}
.card.ajustes{padding-block:4px}
.kpi{padding:12px 8px;text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:var(--acc)}
.kpi .l{font-size:11px;font-weight:500;line-height:1.3}
.kpi.hot{background:var(--surface);box-shadow:0 0 0 2px var(--b-top),var(--s-card)}
.tot{font-weight:800}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px}
.tipo{font-weight:700}
.av{box-shadow:0 4px 10px rgba(20,40,110,.20)}
.av .ini{background:var(--g-3d)}
.feat .ic,.fecha{background:var(--g-3d);color:#fff;box-shadow:0 5px 10px rgba(var(--b-rgb),.30),inset 0 2px 2px rgba(255,255,255,.35),inset 0 -3px 5px rgba(var(--b-osc),.40)}
.fecha{border-radius:14px}
.fecha span{font-weight:700}
.elogo{border-radius:15px;box-shadow:0 5px 10px rgba(20,40,110,.25),inset 0 2px 2px rgba(255,255,255,.30),inset 0 -3px 5px rgba(0,0,0,.22)}
.contador{border-radius:var(--r-card);padding:20px;background:linear-gradient(160deg,var(--b-top) 0%,var(--b-hondo) 100%);
  box-shadow:0 14px 34px -10px rgba(var(--b-rgb),.5),inset 0 2px 3px rgba(255,255,255,.35),inset 0 -5px 10px rgba(var(--b-osc),.4)}
.contador p{font-weight:500}
.contador .btn{background:var(--g-suave);color:var(--b-bot);box-shadow:0 7px 14px rgba(var(--b-osc),.35),inset 0 2px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(var(--som),.30)}
/* campos: hundidos */
.inp,.search{border:0;border-radius:var(--r-btn);padding:13px 15px;font-size:16px;color:var(--fg);background:var(--hundido);
  box-shadow:inset 0 2px 5px rgba(var(--hueco),.20),inset 0 -1px 1px rgba(255,255,255,.9);outline:none}
.inp:focus,.search:focus{box-shadow:inset 0 2px 5px rgba(var(--hueco),.20),0 0 0 3px rgba(var(--b-halo),.95)}
.inp::placeholder,.search::placeholder{color:#5a6680}
.search::placeholder{font-size:13.5px}
.inp.cod{font-size:22px;font-weight:800}
.msg-ed{font-size:14.5px;min-height:190px}
.ayuda-demo{border-radius:16px;border-color:var(--raya)}
/* avisos */
.alert,.locked,.origen,.copiado{border-radius:20px;box-shadow:0 10px 24px -14px rgba(30,60,150,.30)}
.alert{background:linear-gradient(180deg,#fff6e0,#fdefc9);border:1.5px solid #f0c860;color:#5b4410}
.alert svg{color:#94600a}
.alert.ok,.origen,.copiado{background:linear-gradient(180deg,#e9f9f1,#d8f2e5);border:1.5px solid #9ad7b6;color:#14573a}
.alert.ok svg{color:#14573a}
.alert.acc,.locked{background:linear-gradient(180deg,color-mix(in srgb,var(--b-top) 7%,#fff),color-mix(in srgb,var(--b-top) 14%,#fff));
  border:1.5px solid color-mix(in srgb,var(--b-top) 34%,#fff);color:var(--fg)}
.locked{padding:13px 14px}
/* la barra de abajo: la pestaña en la que estás, en relieve */
nav.tabbar{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{gap:4px;padding:2px 1px;color:var(--pie);font-size:10.5px;font-weight:700;white-space:nowrap}
nav.tabbar button svg{box-sizing:border-box;width:46px;height:38px;padding:8px 12px;border-radius:14px;transition:all .2s ease}
nav.tabbar button[aria-current="page"]{color:var(--b-bot);background:none}
nav.tabbar button[aria-current="page"] svg{color:#fff;background:var(--g-3d);transform:translateY(-2px);
  box-shadow:0 6px 12px rgba(var(--b-rgb),.42),inset 0 2px 2px rgba(255,255,255,.5),inset 0 -3px 5px rgba(var(--b-osc),.4)}
nav.tabbar .badge{top:-3px;right:calc(50% - 27px);background:linear-gradient(180deg,#cc3d3d,#b4372b);box-shadow:0 0 0 2px var(--bg)}
/* la conversación */
.bur{border-radius:20px;padding:11px 14px}
.bur.in{border:0;background:var(--surface);box-shadow:0 6px 14px rgba(20,40,110,.15);border-top-left-radius:6px}
.bur.out{background:var(--g-3d);box-shadow:0 6px 14px rgba(var(--b-rgb),.30),inset 0 1px 1px rgba(255,255,255,.4);border-top-right-radius:6px}
.bur small{opacity:1;font-weight:600} .bur.in small{color:var(--muted)} .bur.out small{color:#fff}
/* la hoja que sube, el aviso breve y las gráficas */
.sheet{background:rgba(8,20,50,.55)}
.sheet .panel{background:var(--bg);border-radius:30px 30px 0 0;box-shadow:0 -14px 40px rgba(8,20,50,.35)}
.grab{height:5px;background:#c3cde0}
.sheet h3{font-size:20px;font-weight:800}
.toast{background:linear-gradient(180deg,#24365f,#14213a);color:#fff;border-radius:18px;box-shadow:0 14px 30px -8px rgba(8,20,50,.6),inset 0 1px 1px rgba(255,255,255,.18)}
.gb i{border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,color-mix(in srgb,var(--b-top) 50%,#fff),color-mix(in srgb,var(--b-bot) 50%,#fff))}
.gb .hoy i{background:var(--g-3d);box-shadow:inset 0 2px 2px rgba(255,255,255,.45)}
.hb i{height:12px;border-radius:6px;background:var(--g-3d);box-shadow:inset 0 1px 1px rgba(255,255,255,.45)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* UtoApps base — JS común de las demos por sector (9 oct 2026).
   B.start({views, acts, tab}) pinta views[tab]() en #view; los botones con data-tab cambian de pestaña,
   los que llevan data-tab-go también, y los que llevan data-act llaman a acts[nombre](el). Hoja desde abajo
   (B.sheet), «sul telefono del cliente» (B.phone), aviso breve (B.toast) y aspetto su misura (B.look). */
(function () {
  var B = window.B = {};
  var cfg = null, cur = null;
  B.$ = function (s, r) { return (r || document).querySelector(s); };
  B.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  B.esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; });
  };
  function miles(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "'"); }
  B.chf = function (n, cent) {   // CHF 1'250.– · con centesimi: CHF 86.40
    return "CHF " + (cent ? miles(Math.floor(n)) + "." + (Math.round(n * 100) % 100 + 100).toString().slice(1) : miles(n) + ".–");
  };
  B.kchf = function (n) { return "<small>CHF</small>" + miles(n) + ".–"; };
  B.iniziali = function (n) { return n.split(" ").map(function (p) { return p[0]; }).join("").slice(0, 2); };
  function svg(d, w, sw) {
    return '<svg width="' + (w || 20) + '" height="' + (w || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
      (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  B.svg = svg;
  B.ICO = {
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 13, 3),
    warn: svg('<path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/>'),
    clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', 13, 2.4),
    lock: svg('<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>'),
    bell: svg('<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>'),
    send: svg('<path d="M4 11.5L20 4l-6.5 16-2.5-6.5z"/><path d="M11 13.5L20 4"/>', 16),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 18, 2.4),
    star: svg('<path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/>', 14),
    info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.3"/>'),
    spark: svg('<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2-5.2-1.8 5.2-1.8z"/>')
  };

  B.toast = function (msg, ms) {
    var t = B.$("#toast"); t.innerHTML = msg; t.hidden = false;
    clearTimeout(B.toast._t); B.toast._t = setTimeout(function () { t.hidden = true; }, ms || 3600);
  };

  /* ---------- pestañas ---------- */
  B.render = function (keep) {
    var y = window.scrollY;
    B.$("#view").innerHTML = cfg.views[cur]();
    B.$$("nav.tabbar [data-tab]").forEach(function (b) {
      if (b.getAttribute("data-tab") === cur) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (cfg.after && cfg.after[cur]) cfg.after[cur]();
    if (keep) window.scrollTo(0, y);
  };
  B.go = function (tab) {
    if (!cfg.views[tab]) return;
    cur = tab;
    var v = B.$("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
    B.render(false); window.scrollTo(0, 0);
    if (cfg.onTab) cfg.onTab(tab);
  };
  B.tab = function () { return cur; };
  B.badge = function (tab, n) {
    var b = B.$('nav.tabbar [data-tab="' + tab + '"]'); if (!b) return;
    var e = b.querySelector(".badge");
    if (!n) { if (e) e.remove(); return; }
    if (!e) { e = document.createElement("span"); e.className = "badge"; b.appendChild(e); }
    e.textContent = n;
  };

  /* ---------- hoja desde abajo ---------- */
  B.sheet = function (html) {
    B.$("#sheet-panel").innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
    B.$("#sheet").hidden = false;
  };
  B.closeSheet = function () { B.$("#sheet").hidden = true; };

  /* ---------- sul telefono del cliente (una chat) ---------- */
  B.phone = function (o) {
    var h = '<div class="ph-top"><span class="ph-tag">' + B.esc(o.tag || "Sul telefono del cliente") + '</span>' +

  function nSolicitudes() { var n = 0; for (var k in S.conv) if (S.conv[k].estado === "recibida" || S.conv[k].nuevo) n++; return n; }
  function insignia() { B.badge("mensajes", S.paso === 3 ? nSolicitudes() : 0); }

  /* ---------- LA ENTRADA: solo el logo, los dos botones y el idioma ---------- */
  function oggi() {
    document.body.classList.toggle("entrando", S.paso === 0);
    if (S.paso === 0) return S.entrada === "email" ? entradaEmail() : bienvenida();
    if (S.paso === 1) return perfil();
    if (S.paso === 2) return pasoColegio();
    return inicio();
  }
  function logoGrande() { return '<span class="b2logo" role="img" aria-label="B2School"></span>'; }
  function idiomas() {
    var aqui = document.documentElement.lang || "es";
    return '<nav class="idiomas" aria-label="Idioma">' + IDIOMAS.map(function (x) {
      return '<a href="' + x[2] + '" lang="' + x[0] + '"' + (x[0] === aqui ? ' aria-current="true"' : '') + '>' + x[1] + '</a>';
    }).join("") + '</nav>';
  }
  function bienvenida() {
    return '<section class="entrada">' + logoGrande()
      + (S.conectando ? '<div class="btn primary wide" role="status"><span class="spin"></span>Conectando con LinkedIn…</div>'
        : '<button class="btn primary wide" data-act="login">Continuar con LinkedIn</button>')
      + '<button class="btn wide" data-act="email">Continuar con email</button>'
      + idiomas() + '</section>';
  }
  // entrar con email, SIN contraseña: un código de 6 cifras (o el enlace del mismo correo)
  function entradaEmail() {
    if (!S.codigoEnviado) return '<section class="entrada">' + logoGrande() + '<div class="caja">'
      + '<label class="fld" for="mail" style="margin-top:0">Tu email</label>'
      + '<input class="inp" id="mail" type="email" inputmode="email" autocomplete="off" spellcheck="false" placeholder="nombre@ejemplo.com" value="' + esc(S.mail) + '">'
      + '<p class="note">Sin contraseña: te mandamos un código de 6 cifras y un enlace para entrar.</p>'
      + '<button class="btn primary wide" data-act="manda-codigo">Enviarme el código</button>'
      + '<button class="btn ghost wide" data-act="volver-entrada">Volver</button></div></section>';
    return '<section class="entrada">' + logoGrande() + '<div class="caja">'
      + '<h1>Mira tu correo</h1><p class="sub">Hemos mandado un código a <strong>' + esc(S.mail) + '</strong></p>'
      + '<label class="fld" for="codigo">Código de 6 cifras</label>'
      + '<input class="inp cod" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">'
      + '<p class="note">También puedes tocar el enlace del correo: entras sin escribir nada. El código caduca en 10 minutos.</p>'
      + '<p class="ayuda-demo"><b>Demo:</b> no se manda ningún correo. <button class="chip" data-act="pega-codigo">Usar el código 246810</button></p>'
      + '<button class="btn primary wide" data-act="entra-codigo">Entrar</button>'
      + '<button class="btn ghost wide" data-act="volver-entrada">Cambiar de email</button></div></section>';
  }
  function perfil() {
    var li = S.via !== "email";
    return '<h1>Tu perfil</h1><p class="sub">Así te verán las familias de tu colegio</p>'
      + '<div class="card perfil"><div class="pf"><span class="av">' + cara(li ? YO.a : null, 64) + '</span><div><p class="nm" id="nombre-vista">' + esc(miNombre()) + '</p>'
      + '<p class="d" id="cargo-vista">' + (S.cargo ? esc(S.cargo) : 'Tu cargo saldrá aquí') + '</p></div></div>'
      + (li ? '<p class="origen">' + ICO.check + '<span>Nombre y foto: <strong>de LinkedIn</strong></span></p>'
        : '<p class="origen">' + ICO.check + '<span>Has entrado con tu email, <strong>sin contraseña</strong></span></p>'
          + '<label class="fld" for="nombre">Tu nombre y apellido <small>lo escribes tú</small></label>'
          + '<input class="inp" id="nombre" autocomplete="off" spellcheck="false" placeholder="Nombre y apellido" value="' + esc(S.nombre) + '">')
      + '<label class="fld" for="cargo">¿A qué te dedicas? <small>lo escribes tú</small></label>'
      + '<input class="inp" id="cargo" autocomplete="off" spellcheck="false" placeholder="Tu cargo o tu profesión" value="' + esc(S.cargo) + '">'
      + '<label class="fld">Tu sector <small>lo eliges tú</small></label>'
      + '<button class="inp mi-sector" type="button" data-act="f-mi-sector">' + miSector() + '</button>'
      + '<label class="fld" for="enlace">Tu perfil de LinkedIn <small>opcional</small></label>'
      + '<div class="pegar"><input class="inp" id="enlace" readonly placeholder="linkedin.com/in/…" value="' + esc(S.enlace) + '">'
      + (S.enlace ? '<span class="pill ok" style="align-self:center">' + ICO.check + '</span>' : '<button class="btn small" data-act="pegar">Pegar</button>') + '</div></div>'
      // el email NO va en la tarjeta «Así te verán»: no es público
      + '<div class="locked">' + ICO.lock + '<p><strong>Tu email es privado</strong><small>' + esc(li ? YO.mail : S.mail)
      + (li ? ' · llega de LinkedIn y no lo ve ninguna familia' : ' · es con el que entras y no lo ve ninguna familia') + '</small></p></div>'
      + '<p class="note">' + (li ? 'De LinkedIn solo usamos tu nombre, tu foto y tu email. Tu cargo y tu sector los añades tú.'
        : 'Con el email entras sin contraseña. Tu nombre, tu cargo y tu sector los escribes tú.') + '</p>'
      + '<button class="btn primary wide" style="margin-top:14px" data-act="seguir">Seguir</button>';
  }

  /* ---------- TU COLEGIO: solo entran las familias del colegio · de los hijos, solo la etapa (o nada) ---------- */
  function pasoColegio() {
    var c = S.cole ? COLES[S.cole] : null, quien = S.invita ? gente(S.invita) : null;
    var h = '<div class="onb"><h1>Tu colegio</h1><p class="sub">Solo entran las familias del colegio</p>';
    if (c) {
      h += '<div class="alert ok">' + ICO.check + '<div><p><strong>' + c.n + '</strong></p><p>'
        + (S.cole === "brezo" ? COLES.brezo.familias + ' familias ya están' : c.padres + ' padres y madres ya están')
        + (quien ? ' · te invita ' + esc(quien.n) : ' · confirmado') + '</p></div></div>'
        + '<p class="note"><button class="enlace" data-act="otro-codigo">Usar otro código</button></p>';
    } else if (S.pendiente) {
      h += '<div class="alert">' + ICO.clock + '<div><p><strong>Solicitud enviada</strong></p><p>'
        + (S.pendiente.via === "aval" ? 'Le hemos pedido a ' + esc(gente(S.pendiente.quien).n) + ' que confirme que eres del ' + COLES[S.pendiente.cole].n + '.'
          : 'Le hemos pedido al ' + COLES[S.pendiente.cole].n + ' que confirme que eres una de sus familias.')
        + ' Te avisamos por email. Hasta entonces no ves el directorio.</p></div></div>'
        + '<p class="ayuda-demo"><b>Demo:</b> nadie contesta de verdad. <button class="chip" data-act="confirmada">Simular que te han confirmado</button></p>';
    } else {
      h += '<label class="fld" for="codigo-cole">Código de invitación <small>te lo pasa otra familia o el colegio</small></label>'
        + '<div class="pegar"><input class="inp" id="codigo-cole" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Por ejemplo: NOGAL-3B" value="' + esc(S.codigo) + '">'
        + '<button class="btn small" data-act="comprueba">Comprobar</button></div>'
        + '<p class="ayuda-demo"><b>Demo:</b> prueba con <button class="chip" data-act="pon-codigo" data-k="NOGAL-3B">NOGAL-3B</button> (un colegio con 85 padres y madres) o con '
        + '<button class="chip" data-act="pon-codigo" data-k="BREZO-1A">BREZO-1A</button> (un colegio que empieza).</p>'
        + '<p class="note"><button class="enlace" data-act="sin-codigo">No tengo código</button></p>';
    }
    h += '<h2>Etapa de tus hijos <span class="opc">opcional</span></h2><div class="chips etapas">'
      + ORDEN_ETAPAS.map(function (k) { return '<button class="chip" data-act="etapa" data-k="' + k + '" aria-pressed="' + (S.etapas.indexOf(k) > -1) + '">' + ETAPA[k] + '</button>'; }).join("") + '</div>'
      + '<div class="card ajustes"><div class="sw"><p><strong>Mostrar la etapa en mi perfil</strong><small>Si lo apagas, nadie la ve</small></p>'
      + '<button class="tog" role="switch" data-act="ver-etapa" aria-checked="' + S.verEtapa + '" aria-label="Mostrar la etapa en mi perfil"></button></div></div>'
      + '<div class="locked">' + ICO.lock + '<p><strong>Nunca pedimos el nombre de tus hijos</strong><small>Ni su curso, ni su clase: como mucho, la etapa.</small></p></div>'
      + '<h2>En qué puedes ayudar a otras familias</h2><div class="chips ayudas">'
      + AYUDAS.map(function (a) { return '<button class="chip" data-act="ayuda" data-k="' + a[0] + '" aria-pressed="' + (S.ayudas.indexOf(a[0]) > -1) + '">' + a[1] + '</button>'; }).join("")
      + '</div><div class="card ajustes"><div class="sw"><p><strong>Resumen semanal por email</strong><small>Lo nuevo de tu colegio, una vez a la semana. Te das de baja con un toque.</small></p>'
      + '<button class="tog" role="switch" data-act="resumen" aria-checked="' + S.resumen + '" aria-label="Resumen semanal por email"></button></div></div>'
      + '<button class="btn primary wide" style="margin-top:18px" data-act="entrar"' + (c ? '' : ' disabled') + '>Entrar en mi colegio</button></div>';
    return h;
  }
  // sin código: elegir el colegio y quién confirma (otra familia que ya está dentro, o el propio colegio)
  function dibujaSinCodigo() {
    var s = S.sin, h;
    if (!s.cole) {
      h = '<h3>Entrar sin código</h3><p class="sub">¿De qué colegio eres?</p><div class="list coles" style="margin-top:12px">'
        + ["nogal", "brezo"].map(function (k) {
          return '<div class="row" role="button" data-act="sin-cole" data-c="' + k + '"><div><p class="t">' + COLES[k].n + '</p><p class="d">a ' + COLES[k].km + ' km</p></div><span class="radio"></span></div>';
        }).join("") + '</div>';
    } else if (!s.via) {
      h = '<h3>¿Quién confirma que eres del colegio?</h3><p class="sub">' + COLES[s.cole].n + '</p><div class="choice">'
        + '<button class="opt" data-act="sin-via" data-k="aval"><span><p class="t">Otra familia</p><p class="d">Eliges a un padre o una madre que ya está dentro y te avala</p></span></button>'
        + '<button class="opt" data-act="sin-via" data-k="colegio"><span><p class="t">El colegio</p><p class="d">Tu solicitud llega a la secretaría del colegio</p></span></button></div>';
    } else {
      h = '<h3>¿Quién te avala?</h3><p class="sub">Solo le llega tu nombre y tu cargo</p><div class="list" style="margin-top:12px">'
        + (s.cole === "brezo" ? BREZO : GENTE).slice(0, 4).map(function (p) {
          return '<div class="row" role="button" data-act="sin-quien" data-p="' + p.id + '"><div><p class="t">' + esc(p.n) + '</p><p class="d">' + esc(p.c) + '</p></div><span class="radio"></span></div>';
        }).join("") + '</div>';
    }
    B.sheet(h);
  }
  // el sector NO llega de LinkedIn: B2School lo PROPONE con las palabras del cargo que escribe la persona, y ella lo cambia
  var PISTAS = [[/abogad|jurist|notari|legal/, "Derecho"], [/arquitect|aparejad|interior|obra|construc/, "Arquitectura y construcción"],
    [/medic|enfermer|fisio|farmac|dentist|salud/, "Salud"], [/softwar|desarroll|program|datos|ingenier|tecnolog|informat/, "Tecnología"],
    [/financ|contab|fiscal|seguro|banc/, "Finanzas y seguros"], [/marketing|comunicaci|periodis|disen|publicid/, "Marketing y comunicación"],
    [/profesor|maestr|musica|educa|cultur/, "Educación y cultura"], [/tienda|comerci|venta|vended/, "Comercio"]];
  function proponSector() {
    if (S.sectorElegido) return;
    var t = norm(S.cargo), s = null;
    PISTAS.some(function (x) { if (x[0].test(t)) { s = x[1]; return true; } return false; });
    S.miSector = s;
  }
  function miSector() {
    return S.miSector ? esc(S.miSector) + (S.sectorElegido ? '' : ' <span class="prop">propuesto por tu cargo</span>') + ' ▾'
      : '<span style="color:var(--muted)">Elige tu sector ▾</span>';
  }
  function kpi(v, l, hot) { return '<div class="kpi' + (hot ? ' hot' : '') + '"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }
  // el contador de un colegio que empieza: nadie entra y ve un directorio vacío
  function contador() {
    return '<div class="contador"><div class="n">' + familias() + '</div><p><strong>familias ya están</strong> en el ' + miCole().n + '</p>'
      + '<p>Cuantas más seáis, más útil es. El grupo de WhatsApp de la clase es el camino más rápido.</p>'
      + '<button class="btn wide" data-act="invitar">Invitar al grupo de WhatsApp de la clase</button></div>';
  }
  function tusAjustes() {
    return '<h2>Tus ajustes</h2><div class="card ajustes"><div class="sw"><p><strong>Mostrar la etapa de mis hijos</strong><small>'
      + (S.etapas.length ? etapas(S.etapas, " y ") : 'No has indicado ninguna') + '</small></p>'
      + '<button class="tog" role="switch" data-act="ver-etapa" aria-checked="' + S.verEtapa + '" aria-label="Mostrar la etapa de mis hijos"></button></div>'
      + '<div class="sw"><p><strong>Resumen semanal por email</strong><small><button class="enlace" data-act="ver-resumen">Ver un ejemplo</button></small></p>'
      + '<button class="tog" role="switch" data-act="resumen" aria-checked="' + S.resumen + '" aria-label="Resumen semanal por email"></button></div></div>';
  }
  function inicio() {
    var h = '<h1>Hola, ' + esc(pila(yo())) + '</h1><p class="sub">Lunes 16 de noviembre · ' + miCole().n + '</p>';
    if (enBrezo()) {
      h += contador();
      h += '<div class="alert acc">' + ICO.spark + '<div><p><strong>Sois de las primeras.</strong> El muro y los eventos se llenan cuando entran más familias: invitar es lo que más ayuda ahora.</p></div></div>';
      return h + tusAjustes();
    }
    if (S.look) h += '<div class="alert acc">' + ICO.spark + '<div><p><strong>Portal del Colegio Nogal de ejemplo</strong></p><p>Con su logo y sus colores, para todas sus familias.</p></div></div>';
    h += '<div class="kpis">' + kpi(86, "padres y madres en tu cole") + kpi(nOport(), "oportunidades abiertas") + kpi(3, "próximos eventos") + '</div>';
    var n = nSolicitudes();
    if (n) h += '<button class="row" style="margin-top:14px" data-tab-go="mensajes"><div><p class="t">' + (n === 1 ? 'Tienes 1 mensaje por contestar' : 'Tienes ' + n + ' mensajes por contestar') + '</p><p class="d">Solicitudes y respuestas de familias de tu cole</p></div><span class="pill acc">Ver</span></button>';
    h += '<div class="alert ok">' + ICO.spark + '<div><p><strong>+9 padres y madres</strong> en los últimos 7 días. Contigo, ya sois 86.</p></div></div>';
    h += '<div class="card invita"><p style="margin:0"><strong>¿Falta alguien de tu clase?</strong><br><span class="sub" style="font-size:13px">Invita al grupo de WhatsApp</span></p><button class="btn small primary" data-act="invitar">Invitar</button></div>';
    h += '<h2>Lo último en el muro</h2><div class="list">' + (S.publicado ? post(S.publicado, true) : '') + POSTS.slice(0, 2).map(function (p) { return post(p); }).join("") + '</div>';
    h += '<h2>Próximo evento</h2>' + evento(EVENTOS[0]);
    h += tusAjustes();
    h += '<h2>Para el colegio</h2><button class="row" data-tab-go="colegio"><div><p class="t">Vista del colegio</p><p class="d">Lo que ve la dirección: solo cifras de conjunto</p></div><span class="pill">Abrir</span></button>';
    return h;
  }

  /* ---------- DIRECTORIO: familias (mi colegio · colegios cercanos, Pro) y empresas ---------- */
  function directorio() {
    if (enBrezo()) return '<h1>Directorio</h1><p class="sub">' + miCole().n + '</p>' + contador()
      + '<p class="cuenta">Las primeras familias</p><div class="list" id="res">' + BREZO.map(persona).join("") + '</div>';
    var emp = S.seg === "empresas", cerca = S.ambito === "cerca";
    var h = '<h1>Directorio</h1><p class="sub">' + (emp ? 'Las empresas de las familias' : 'Colegio Nogal de ejemplo · 86 padres y madres') + '</p>'
      + '<div class="seg" role="group" aria-label="Qué ver"><button data-act="seg" data-k="familias" aria-pressed="' + !emp + '">Familias</button>'
      + '<button data-act="seg" data-k="empresas" aria-pressed="' + emp + '">Empresas</button></div>';
    if (emp) return h + '<div class="list emps" id="res" style="margin-top:12px">' + EMPRESAS.map(empresaFila).join("") + '</div>';
    h += '<div class="chips ambito"><button class="chip" data-act="ambito" data-k="mio" aria-pressed="' + !cerca + '">Mi colegio</button>'
      + '<button class="chip" data-act="ambito" data-k="cerca" aria-pressed="' + cerca + '">Colegios cercanos<span class="pro">PRO</span></button></div>'
      + '<div class="filtros"><div class="chips"><button class="chip" data-act="f-etapa">Etapa: ' + (S.etapa ? ETAPA[S.etapa] : 'todas') + ' ▾</button>'
      + '<button class="chip" data-act="f-sector">Sector: ' + (S.sector || 'todos') + ' ▾</button></div>'
      + '<input class="search" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Busca un cargo, un sector o una palabra" aria-label="Buscar en el directorio" value="' + esc(S.q) + '"></div>';
    return h + '<div id="res">' + resultados() + '</div>';
  }
  function filtra(L) {
    var q = norm(S.q.trim());
    return L.filter(function (p) {
      if (S.etapa && p.k.indexOf(S.etapa) < 0) return false;
      if (S.sector && p.s !== S.sector) return false;
      return !q || norm(p.n + " " + p.c + " " + p.s + " " + etapas(p.k, " ")).indexOf(q) > -1;
    });
  }
  function resultados() {
    if (S.ambito === "cerca") {
      var h = '<div class="alert acc">' + ICO.star + '<div><p><strong>Cuenta Pro:</strong> también puedes conocer a las familias de 3 colegios cercanos, 172 padres y madres más.</p></div></div>';
      CERCA.forEach(function (g) {
        var L = filtra(g.gente), c = COLES[g.cole];
        if (L.length) h += '<div class="grupo"><b>' + c.n + '</b><span>a ' + c.km + ' km · ' + c.padres + ' padres y madres</span></div><div class="list">' + L.map(persona).join("") + '</div>';
      });
      return h;
    }
    var L = filtra(GENTE), activo = S.q.trim() || S.etapa || S.sector;
    return '<p class="cuenta">' + (activo ? (L.length === 1 ? '1 resultado' : L.length + ' resultados') : 'Los últimos en unirse, primero') + '</p>'
      + '<div class="list">' + (L.length ? L.map(persona).join("") : '<p class="sub">Nadie con ese filtro.</p>') + '</div>';
  }
  function persona(p) {
    // «Escribir» es un mensaje DENTRO de B2School (el primero, una solicitud). LinkedIn queda como botón secundario, dentro.
    var cv = S.conv[p.id];
    return '<article class="persona"><span class="av">' + cara(p.a, 44) + '</span><div><p class="t">' + esc(p.n) + '</p><p class="d">' + esc(p.c) + '</p></div>'
      + '<button class="btn small ghost" data-act="escribir" data-p="' + p.id + '">' + ICO.send + 'Escribir</button>'
      + '<div class="pills"><span class="pill">' + esc(p.s) + '</span>' + p.k.map(function (k) { return '<span class="pill acc">' + ETAPA[k] + '</span>'; }).join("")
      + (cv && cv.estado === "enviada" ? '<span class="pill warn">' + ICO.clock + ' solicitud enviada</span>' : '')
      + (cv && cv.estado === "ok" ? '<span class="pill ok">' + ICO.check + ' ya habláis</span>' : '') + '</div></article>';
  }
  function empresaFila(e) {
    var p = gente(e.de);
    return '<button class="empresa" data-act="empresa" data-e="' + e.id + '"><span class="elogo" style="background:' + e.col + '">' + e.ini + '</span>'
      + '<span><p class="t">' + esc(e.n) + '</p><p class="d">De ' + esc(p.n) + ' · ' + esc(e.fam) + '</p></span>'
      + '<span class="pill">' + e.coles.length + ' colegios</span></button>';
  }
  // el mensaje ya escrito («Somos del mismo cole…»): se puede cambiar antes de enviarlo
  function mensaje(p) {
    if (p.cole && p.cole !== S.cole) return 'Hola, ' + pila(p) + '. Somos de colegios vecinos: el mío es el ' + miCole().n + '. He visto tu perfil en B2School y me gustaría conocerte. ¿Hablamos?';
    var mios = yo().k, comun = p.k.filter(function (k) { return mios.indexOf(k) > -1; })[0];
    var motivo = S.motivo === "muro" ? "He visto tu publicación en el muro y me interesa."
      : (p.id === "carmen" ? "Busco una arquitecta para reformar mi despacho." : "He visto tu perfil en B2School y me gustaría conocerte.");
    return 'Hola, ' + pila(p) + '. Somos del mismo cole, el ' + miCole().n + (comun ? ': tenemos hijos en ' + ETAPA[comun] : '') + '. ' + motivo + ' ¿Hablamos?';
  }

  /* ---------- MENSAJES: la bandeja de entrada · el primer mensaje a alguien es una solicitud ---------- */
  function ultimo(cv) { return cv.msgs[cv.msgs.length - 1]; }
  function dice(m) { return esc(m.t.replace(/\{yo\}/g, pila(yo()))); }   // {yo} = el nombre de pila de quien entra
  function mensajes() {
    var rec = [], ok = [], env = [];
    Object.keys(S.conv).forEach(function (id) { var cv = S.conv[id]; (cv.estado === "recibida" ? rec : cv.estado === "ok" ? ok : env).push(id); });
    var h = '<h1>Mensajes</h1><p class="sub">Solo entre familias de B2School</p>';
    if (!rec.length && !ok.length && !env.length) return h + '<div class="card"><p style="margin:0"><strong>Todavía no hay mensajes</strong></p><p class="sub" style="font-size:13.5px">Busca a alguien en el directorio y toca «Escribir».</p>'

      S.conv[id] = {estado: "enviada", h: "ahora", msgs: [{dir: "out", t: t, h: "ahora"}]};
      B.closeSheet(); B.render(true);
      B.toast(ICO.check + ' Solicitud enviada a ' + esc(pila(p)) + '. Te avisamos cuando conteste.');
      // en la demo, Carmen acepta a los pocos segundos (para ver el camino entero)
      if (id === "carmen") setTimeout(function () {
        var cv = S.conv.carmen; if (!cv || cv.estado !== "enviada") return;
        cv.estado = "ok"; cv.nuevo = true;
        cv.msgs.push({dir: "in", t: "¡Hola, {yo}! Claro que sí. ¿Te va bien el jueves, después de dejar a los niños en el cole?", h: "ahora"});
        insignia(); if (B.tab() === "mensajes" || B.tab() === "directorio" || B.tab() === "oggi") B.render(true);
        if (B.tab() === "chat" && S.chat === "carmen") { cv.nuevo = false; insignia(); B.render(true); }
        B.toast(ICO.check + ' Carmen ha aceptado tu solicitud');
      }, 4000);
    },
    "ver-li": function (el) { var p = gente(el.getAttribute("data-p")); B.toast(I.link + ' En la app real se abre el perfil de ' + esc(pila(p)) + ' en LinkedIn', 3000); },
    acepta: function (el) {
      var id = el.getAttribute("data-p"), cv = S.conv[id]; if (!cv) return;
      cv.estado = "ok"; S.chat = id; insignia(); B.go("chat");
      B.toast(ICO.check + ' Solicitud aceptada: ya podéis hablar');
    },
    rechaza: function (el) {
      var id = el.getAttribute("data-p"), p = gente(id);
      delete S.conv[id]; insignia(); B.render(true);
      B.toast('Solicitud rechazada. ' + esc(pila(p)) + ' no recibe ningún aviso.');
    },
    "abre-chat": function (el) { var id = el.getAttribute("data-p"); if (S.conv[id]) S.conv[id].nuevo = false; S.chat = id; insignia(); B.go("chat"); },
    responde: function () {
      var e = B.$("#resp"), t = e ? e.value.trim() : "", cv = S.conv[S.chat];
      if (!t || !cv) return;
      cv.msgs.push({dir: "out", t: t, h: "ahora"}); B.render(false); window.scrollTo(0, document.body.scrollHeight);
    },
    tipof: function (el) { S.tipoF = el.getAttribute("data-k"); B.render(true); },
    publicar: function () { S.borrador = null; dibujaPublicar(); },
    tipo: function (el) { S.borrador = el.getAttribute("data-t"); dibujaPublicar(); },
    publica: function () {
      if (!S.borrador) return;
      S.publicado = {t: S.borrador, txt: SUGERIDO[S.borrador], h: "ahora"};
      S.tipoF = "todas"; B.closeSheet(); B.go("muro");
      B.toast(ICO.check + ' Publicado en el muro de tu colegio');
    },
    empresa: function (el) {
      var e = empresa(el.getAttribute("data-e")), p = gente(e.de);
      B.sheet('<div class="ficha-emp"><div class="cab"><span class="elogo" style="background:' + e.col + '">' + e.ini + '</span><div><h3 style="margin:0">' + esc(e.n) + '</h3>'
        + '<p class="sub" style="font-size:13px">De ' + esc(p.n) + ' · ' + esc(e.fam) + '</p></div></div>'
        + '<h4>Qué hacemos</h4><p>' + esc(e.que) + '</p>'
        + '<h4>Servicios</h4><div class="pills">' + e.serv.map(function (x) { return '<span class="pill">' + esc(x) + '</span>'; }).join("") + '</div>'
        + '<h4>En qué colegios trabajamos</h4><div class="pills">' + e.coles.map(function (k) { return '<span class="colep">' + I.cole + COLES[k].n + '</span>'; }).join("") + '</div>'
        + '<div class="pie-emp"><button class="btn primary" data-act="escribir" data-p="' + p.id + '">' + ICO.send + ' Escribir a ' + esc(pila(p)) + '</button>'
        + '<button class="btn ghost" data-act="chiudi">Cerrar</button></div></div>');
    },
    apuntar: function (el) {
      var id = el.getAttribute("data-e"), e = EVENTOS.filter(function (x) { return x.id === id; })[0];
      S.apuntado[id] = true; B.render(true);
      B.toast(ICO.check + (e.ponentes ? ' Gracias: le pasamos tu nombre al colegio para preparar la charla' : ' Apuntada: ' + e.f.toLowerCase() + '. Te lo recordamos el día antes.'));
    },
    versione: function () {
      if (S.paso !== 3 || enBrezo()) return;
      B.sheet('<h3>Portal del colegio</h3><p class="sub">Colegio Nogal de ejemplo · colegio partner de B2School</p><div class="choice">'
        + '<button class="opt" data-act="standard" aria-pressed="' + !S.look + '"><span><p class="t">Aspecto de B2School</p><p class="d">El logo y los colores de B2School</p></span>' + (S.look ? '' : '<span class="pill ok">' + ICO.check + '</span>') + '</button>'
        + '<button class="opt" data-act="su-misura" aria-pressed="' + S.look + '"><span><p class="t">Con la marca del colegio</p><p class="d">Su logo y sus colores, en todo el portal</p></span>' + (S.look ? '<span class="pill ok">' + ICO.check + '</span>' : '') + '</button></div>');
    },
    "su-misura": function () {
      S.look = true; B.look(true); cabecera(); acts.versione();
      setTimeout(function () { B.closeSheet(); B.go("oggi"); B.toast(ICO.spark + ' Portal del Colegio Nogal de ejemplo: su logo y sus colores', 2400); }, 1300);
    },
    standard: function () { S.look = false; B.look(false); cabecera(); B.closeSheet(); }
  };

  /* La cabecera de color con su curva (estilo de la familia): el título de cada pantalla y su subtítulo pasan a una banda
     propia al pintarse. La entrada no la lleva (ahí solo van el logo, los dos botones y el idioma). */
  function cabezal() {
    var v = B.$("#view"), h = v.querySelector("h1");
    if (h && !h.closest(".entrada") && !h.closest(".cabz")) {
      var c = document.createElement("div"), antes = h.previousElementSibling, sub = h.nextElementSibling;
      c.className = "cabz";
      if (antes && !antes.classList.contains("rol")) antes = null;
      h.parentNode.insertBefore(c, antes || h);
      if (antes) c.appendChild(antes);
      c.appendChild(h);
      if (sub && sub.classList.contains("sub")) c.appendChild(sub);
    }
    document.body.classList.toggle("sin-cabz", !v.querySelector(".cabz"));   // una pantalla sin título (la conversación): la curva la lleva la cabecera
  }
  new MutationObserver(cabezal).observe(B.$("#view"), {childList: true});

  B.start({lang: "es",
    tab: "oggi",
    views: {oggi: oggi, directorio: directorio, mensajes: mensajes, chat: chat, muro: muro, eventos: eventos, colegio: colegio},
    acts: acts,
    after: {
      oggi: function () {
        var c = B.$("#cargo"), b = B.$(".mi-sector"), n = B.$("#nombre");
        if (c) c.addEventListener("input", function () {
          S.cargo = c.value; proponSector(); if (b) b.innerHTML = miSector();
          var v = B.$("#cargo-vista"); if (v) v.textContent = S.cargo || "Tu cargo saldrá aquí";
        });
        if (n) n.addEventListener("input", function () {
          S.nombre = n.value; var v = B.$("#nombre-vista"); if (v) v.textContent = miNombre();
          var i = B.$(".perfil .ini"); if (i) i.textContent = iniciales();
        });
        var k = B.$("#codigo-cole"); if (k) k.addEventListener("keydown", function (ev) { if (ev.key === "Enter") ponCodigo(k.value); });
        var m = B.$("#mail"); if (m) m.addEventListener("keydown", function (ev) { if (ev.key === "Enter") acts["manda-codigo"](); });
        var o = B.$("#codigo"); if (o) o.addEventListener("keydown", function (ev) { if (ev.key === "Enter") acts["entra-codigo"](); });
      },
      directorio: function () { var q = B.$("#q"); if (q) q.addEventListener("input", function () { S.q = q.value; B.$("#res").innerHTML = resultados(); }); },
      chat: function () {
        var r = B.$("#resp"); if (r) r.addEventListener("keydown", function (ev) { if (ev.key === "Enter") acts.responde(); });
        var m = B.$('nav.tabbar [data-tab="mensajes"]'); if (m) m.setAttribute("aria-current", "page");   // el chat es parte de «Mensajes»
      }
    },
    onTab: function (t) {
      B.$("#fab").hidden = t !== "muro"; if (t !== "directorio") S.q = "";
      var m = B.$('nav.tabbar [data-tab="mensajes"]'); if (m && t === "chat") m.setAttribute("aria-current", "page");
    }
  });
  B.$("#fab").hidden = B.tab() !== "muro";
  cabecera();
})();
</script>
</body>
</html>
